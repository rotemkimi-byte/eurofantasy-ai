name: Publish fresh public demo from private source
# Publish the verified runtime with the player shooting lineups button.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-live-demo.yml']
  workflow_run:
    workflows: ["EuroFantasy scheduled backtest","EuroFantasy scheduled fantasy.sync","EuroFantasy scheduled fast-live-sync","EuroFantasy scheduled install-fantasy-learning","EuroFantasy scheduled install-matchup-context","EuroFantasy scheduled install-rolling-learning","EuroFantasy scheduled install-round-lab","EuroFantasy scheduled matchups-live","EuroFantasy scheduled official-offense","EuroFantasy scheduled position-matchups-live","EuroFantasy scheduled recent-form-2026-27-only","EuroFantasy scheduled roster-sync"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: verified-live-demo-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_id == '1466932960' && github.repository == 'rotemkimi-byte/eurofantasy-ai' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == 1466932960 && github.event.workflow_run.head_branch == 'main')) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rotemkimi-byte/eurofantasy-ai-dev-test
          ref: main
          path: private
          token: ${{ secrets.DEV_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build allowlisted static site from private source
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          if (node scripts/audit_player_identities.cjs && python scripts/build_public_dist.py "$PWD" "$RUNNER_TEMP/live-demo-dist" "$RUNNER_TEMP/live-demo-manifest.json") > "$RUNNER_TEMP/private-build.log" 2>&1; then
            echo 'Private source passed runtime allowlist and integrity validation.'
          else
            echo 'Private source validation failed; nothing published.'
            exit 1
          fi
      - name: Update only verified public runtime files
        working-directory: public
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,subprocess
          root=pathlib.Path.cwd().resolve()
          dist=pathlib.Path(os.environ['RUNNER_TEMP'])/'live-demo-dist'
          m=pathlib.Path(os.environ['RUNNER_TEMP'])/'live-demo-manifest.json'
          old=json.loads((root/'.github/demo-manifest.json').read_text())
          new=json.loads(m.read_text())
          def files(manifest):
              result={}
              for r in manifest['files']:
                  p=r['path']
                  assert re.fullmatch(r'(?:[a-zA-Z0-9_-]+/)*[a-zA-Z0-9_.-]+\.(?:js|css|html|json|json\.gz)',p) and not any(s.startswith('.') for s in p.split('/'))
                  assert not p.startswith(('scripts/','tests/','automation/','docs/'))
                  assert p not in result
                  result[p]=r
              assert len(result)==manifest['count'] and 'index.html' in result and 'data/meta.json' in result
              return result
          previous=files(old); current=files(new)
          expected=set(current)|{'.nojekyll'}
          actual={p.relative_to(dist).as_posix() for p in dist.rglob('*') if p.is_file()}
          assert actual==expected and not any(p.is_symlink() for p in dist.rglob('*'))
          tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))-{''}
          metadata={'README.md','.github/demo-manifest.json'}
          metadata |= {p for p in tracked if re.fullmatch(r'\.github/workflows/[a-zA-Z0-9_.-]+\.yml',p)}
          assert tracked==set(previous)|{'.nojekyll'}|metadata
          for name,r in current.items():
              src=dist/name; dst=root/name
              assert src.is_file() and src.resolve()==src and dst.resolve()==dst and root in dst.parents
              assert src.stat().st_size==r['bytes'] and hashlib.sha256(src.read_bytes()).hexdigest()==r['sha256']
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
          for name in set(previous)-set(current):
              dst=root/name
              assert dst.is_file() and dst.resolve()==dst and root in dst.parents
              dst.unlink()
          (root/'.nojekyll').touch()
          shutil.copyfile(m,root/'.github/demo-manifest.json')
          subprocess.run(['git','add','--',*sorted(set(previous)|set(current)|{'.nojekyll','.github/demo-manifest.json'})],check=True)
          assert set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))-{''}==expected|metadata
          print(f'Validated {len(current)} browser runtime files. Private development files excluded.')
          PY
          git config user.name 'eurofantasy-demo-bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit --quiet -m 'Publish verified public runtime and fresh data'
            git push --quiet origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/live-demo-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for verified artifact
        uses: actions/github-script@v7
        with:
          script: |
            for (let i=0;i<10;i++) {
              const {data}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:context.runId,name:'github-pages',per_page:100});
              const a=data.artifacts.filter(a=>a.name==='github-pages' && !a.expired);
              if(a.length===1)return;
              if(a.length>1)throw Error('Multiple artifacts');
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw Error('Verified artifact unavailable');
      - uses: actions/deploy-pages@v4
        id: deployment
