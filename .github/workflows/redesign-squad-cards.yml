name: Redesign squad cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/redesign-squad-cards.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-squad-redesign
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Put jersey inside card and show club opponent and credit change
        run: |
          python - <<'PYINSTALL'
          import base64,zlib,subprocess
          from pathlib import Path
          patch=zlib.decompress(base64.b64decode(''))
          if subprocess.run(['git','apply','--reverse','--check','-'],input=patch,capture_output=True).returncode==0:
              print('Redesign already installed')
          else:
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          PYINSTALL
      - name: Check price updates and JavaScript syntax
        run: |
          node --check round-review.js
          node tests/test_round_review.cjs
          node - <<'JSCHECK'
          const fs=require('fs'),vm=require('vm');
          for(const m of fs.readFileSync('index.html','utf8').matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))if(m[1].trim())new vm.Script(m[1]);
          console.log('Inline scripts parse successfully');
          JSCHECK
          git diff --check
      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html squad-layout.css round-review.js
          if ! git diff --cached --quiet; then
            git commit -m 'Keep squad jerseys inside cards and highlight opponents clubs and credit changes'
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
            done
            if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
