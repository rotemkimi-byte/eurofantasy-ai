name: Install rolling historical learning
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-rolling-learning.yml'
  schedule:
    - cron: '23,53 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-matchup-context
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rolling replay and complete-input capture
        run: |
          python - <<'PYINSTALL'
          import zlib,base64
          source=zlib.decompress(base64.b64decode('')).decode('utf-8')
          exec(compile(source,'install_rolling.py','exec'),{'__name__':'__main__'})
          PYINSTALL
      - name: Verify replay and prevent look-ahead learning
        run: |
          python -m unittest discover -s tests -p 'test_rolling_learning.py'
          node --check rolling-learning.js
          node tests/test_replay.cjs
          node tests/test_capture.cjs
      - name: Refresh completed results and replay the current projection
        run: |
          python scripts/fantasy_learning.py prepare
          python scripts/fantasy_learning.py grade
          python scripts/rolling_learning.py
      - name: Check whether upcoming games need input snapshots
        id: capture
        run: |
          python - <<'PYCHECK'
          import os
          from datetime import datetime,timezone,timedelta
          import sys
          sys.path.insert(0,'scripts')
          from rolling_learning import OUT,engine_id
          from fantasy_learning import load,date
          now=datetime.now(timezone.utc);ident=engine_id()
          needed=any(not g['played'] and now+timedelta(minutes=10)<date(g['start'])<=now+timedelta(hours=24) and load(OUT/f'input-snapshots/E2026-{g["gameCode"]}.json',{}).get('engineId')!=ident for g in load(OUT/'schedule.json',{}).values())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('needed='+str(needed).lower()+'\n')
          PYCHECK
      - name: Capture immutable inputs for upcoming games
        if: steps.capture.outputs.needed == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/snapshot_replay.py
      - name: Save tested replay and frozen inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html rolling-learning.js rolling-model-version.js learning-model-version.js scripts/rolling_learning.py scripts/replay-engine.cjs scripts/snapshot_replay.py tests/test_rolling_learning.py tests/test_replay.cjs tests/test_capture.cjs data/learning data/backtest/cache
          if ! git diff --cached --quiet; then
            git commit -m 'Add chronological replay diagnostics complete-input capture and guarded calibration'
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
            done
            if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish rolling learning
        id: deployment
        uses: actions/deploy-pages@v4
