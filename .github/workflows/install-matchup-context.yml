              if old not in s:raise RuntimeError('Snapshot readiness changed')
              s=s.replace(old,old+' && (!window.__matchupContextEnabled || window.__matchupContextReady)',1)
          if 'context:x.context' not in s:
              s=s.replace('currentSeasonWeight:x.currentSeasonWeight','currentSeasonWeight:x.currentSeasonWeight,context:x.context?{involvementFactor:x.context.involvementFactor,defenseFactor:x.context.defenseFactor,defenseSample:x.context.defenseSample,rival:x.context.rival?.name,scenarios:x.context.scenarios,minutesCorrectionActive:x.context.minutesCorrectionActive}:null',1)
          p.write_text(s)
