name: EuroFantasy attack defense and team context
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-matchup-context.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-matchup-context
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install context extension without replacing the roster layout
        run: |
          python - <<'PYINSTALL'
          from pathlib import Path
          Path('.context-install.b64').write_text('')
          PYINSTALL
      - name: Complete context installation
        run: |
          python - <<'PYINSTALL'
          from pathlib import Path
          import base64, zlib
          p=Path('.context-install.b64')
          encoded=p.read_text()+''
          source=zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          exec(compile(source, 'install_context.py', 'exec'), {'__name__': '__main__'})
          p.unlink()
          PYINSTALL
      - name: Refresh observed stats, available rosters and pregame strength
        run: |
          python scripts/build_matchup_context.py
          python scripts/fantasy_learning.py prepare
          python scripts/fantasy_learning.py grade
      - name: Verify data handling, bounded effects and chronological calibration
        run: |
          python -m unittest discover -s tests -p 'test_matchup_context.py'
          node tests/test_matchup_context.cjs
          node tests/test_context_browser.cjs
          node --check matchup-context.js
          node --check scripts/forecast_players.cjs
      - name: Freeze the actual website model before upcoming games
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/snapshot_live_model.py
      - name: Save context data and model integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html matchup-context-core.js matchup-context.js learning.js learning-model-version.js scripts/build_matchup_context.py scripts/fantasy_learning.py scripts/forecast_players.cjs scripts/snapshot_live_model.py tests/test_matchup_context.py tests/test_matchup_context.cjs tests/test_context_browser.cjs data/context data/matchup-context.json data/learning data/backtest/cache
          if ! git diff --cached --quiet; then
            git commit -m 'Add attack involvement defense minute scenarios and calibrated team context'
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
            done
            if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified context model
        id: deployment
        uses: actions/deploy-pages@v4
