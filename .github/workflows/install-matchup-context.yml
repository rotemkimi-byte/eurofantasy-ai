name: EuroFantasy attack defense and team context
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-matchup-context.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-matchup-context
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install context extension without replacing the roster layout
        run: |
          python - <<'PYINSTALL'
          from pathlib import Path
          import json
          payload=json.loads('{"matchup-context-core.js": "/* Pure, bounded context extension shared by browser and snapshots. */\\n(function(root){\\n\'use strict\';\\nconst num=v=>v==null||v===\'\'||!Number.isFinite(Number(v))?null:Number(v);\\nconst clip=(v,a,b)=>Math.max(a,Math.min(b,v));\\nconst key=s=>String(s||\'\').normalize(\'NFD\').replace(/[\\\\u0300-\\\\u036f]/g,\'\').toLowerCase().replace(/[^a-z0-9]+/g,\' \').trim().split(/\\\\s+/).sort().join(\' \');\\nfunction cdf(x){const z=Math.abs(x)/Math.sqrt(2),t=1/(1+.3275911*z);const erf=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-z*z);return .5*(1+(x<0?-erf:erf));}\\nfunction tails(margin,winProb=null){const normalWin=1-cdf(-margin/11.5),p=num(winProb);return {win:(1-cdf((15-margin)/11.5))*(p==null?1:p/normalWin),loss:cdf((-15-margin)/11.5)*(p==null?1:(1-p)/(1-normalWin))};}\\nfunction valid(data,now=Date.now()){\\n const time=Date.parse(data?.updated_at);return data?.schema===\'matchup-context-v1\'&&data.season===\'E2026\'&&Number.isFinite(time)&&time<=now+300000&&now-time<36*3600000;\\n}\\nfunction project(x,p,data){\\n const y={...x};if(!valid(data)||p.status===\'out\'||![\'G\',\'F\',\'C\'].includes(p.pos))return y;\\n const profile=data.players?.[key(p.name)],opp=x.match?.opponent||p.opponent,defense=data.defense?.[opp];\\n const margin=num(x.match?.margin)||0;const tail=tails(margin,x.match?.winProb);let baseMin=num(x.minutes)||0;\\n if(baseMin<=0)return y;\\n // The base model already reduces expensive-player minutes at margin >= 10.\\n // Replace that single scenario adjustment rather than count it twice.\\n let neutral=baseMin;if(margin>=10)neutral/=(Number(p.price)>=12?.97:Number(p.price)<=7?1.05:1);\\n const logs=profile?.logs||[],groups=[logs.filter(r=>Math.abs(r.margin)<=10),logs.filter(r=>r.margin>=15),logs.filter(r=>r.margin<=-15)];\\n const mean=rs=>rs.length?rs.reduce((s,r)=>s+r.minutes,0)/rs.length:null;\\n const seasonMean=num(profile?.avgMinutes);const observed=groups.map(mean);\\n const fallbacks=[1.035,.90,.93];\\n let values=groups.map((g,i)=>{const w=g.length/(g.length+5);return clip(neutral*(observed[i]!=null&&seasonMean>0?1+w*clip(observed[i]/seasonMean-1,-.3,.3):fallbacks[i]),0,36);});\\n const weights=[Math.max(0,1-tail.win-tail.loss),tail.win,tail.loss];\\n let minutes=values.reduce((s,v,i)=>s+v*weights[i],0);\\n // Until eight games, scenarios explain risk without forcing a guessed mean correction.\\n if((profile?.games||0)<8){const shift=baseMin-minutes;values=values.map(v=>clip(v+shift,0,36));minutes=baseMin;}\\n else minutes=clip(minutes,baseMin*.92,Math.min(36,baseMin*1.08));\\n let involvementFactor=1;\\n if(profile?.previousGames>=3&&profile.recentGames>=2&&profile.previousEventsPerMinute>0&&num(profile.recentEventsPerMinute)!=null){\\n  const reliability=profile.games/(profile.games+8);\\n  involvementFactor=1+clip((profile.recentEventsPerMinute/profile.previousEventsPerMinute-1)*.20*reliability,-.06,.06);\\n }\\n let defenseFactor=1,defensePointsDelta=null;\\n const avg=profile?.averages;const league=data.league;\\n if(profile?.games>=3&&defense?.games>=3&&avg&&num(avg.fieldGoalsAttempted2)!=null&&num(avg.fieldGoalsAttempted3)!=null&&num(league?.rate2)!=null&&num(league?.rate3)!=null){\\n  const r2=(defense.made2+50*league.rate2)/(defense.attempts2+50),r3=(defense.made3+50*league.rate3)/(defense.attempts3+50);\\n  defensePointsDelta=2*avg.fieldGoalsAttempted2*(r2-league.rate2)+3*avg.fieldGoalsAttempted3*(r3-league.rate3);\\n  // This residual is shooting style only; the existing position-PIR factor remains separate.\\n  defenseFactor=1+clip(defensePointsDelta/Math.max(10,Math.abs(num(x.expected)||0))*.35,-.03,.03);\\n }\\n const rate=(num(x.expected)||0)/baseMin;const expected=Math.max(0,rate*minutes*involvementFactor*defenseFactor);\\n const rival=Object.values(data.players||{}).filter(r=>r.team===opp&&r.pos===p.pos&&!(data.teams?.[opp]?.availability?.missing||[]).some(m=>m.name===r.name&&m.status===\'out\')).sort((a,b)=>b.avgMinutes-a.avgMinutes)[0]||null;\\n y.expected=expected;y.minutes=minutes;y.value=expected/Math.max(.1,Number(p.price)||0);\\n y.floor=Math.min(num(x.floor)??expected,Math.max(0,rate*Math.min(...values)*.65));\\n y.ceiling=Math.max(num(x.ceiling)??expected,rate*Math.max(...values)*1.3);\\n y.context={profile:profile||null,involvementFactor,defenseFactor,defensePointsDelta,rival,opponent:opp,defenseSample:defense?.games||0,baseExpected:x.expected,pirChange:expected-(num(x.expected)||0),minutesChange:minutes-baseMin,\\n  scenarios:[{id:\'close\',minutes:values[0],weight:weights[0],observedGames:groups[0].length},{id:\'big-win\',minutes:values[1],weight:weights[1],observedGames:groups[1].length},{id:\'big-loss\',minutes:values[2],weight:weights[2],observedGames:groups[2].length}],minutesCorrectionActive:(profile?.games||0)>=8};\\n y.source=(x.source||\'model\')+\' + attack / defense / minute scenarios\';return y;\\n}\\nfunction applyTeams(matches,data){\\n if(!valid(data))return false;\\n for(const [t,info] of Object.entries(data.teams||{})){\\n  const m=matches[t];if(!m||m.opponent!==info.opponent||!!m.home!==info.home||num(info.margin)==null)continue;\\n  m.margin=info.margin;m.winProb=info.winProb;m.teamPoints=(m.total+m.margin)/2;\\n  const cdfAt=v=>cdf((v-m.margin)/11.5);\\n  m.p20=1-cdfAt(20);m.p11_20=cdfAt(20)-cdfAt(10);m.p1_10=cdfAt(10)-cdfAt(0);\\n  m.l1_10=cdfAt(0)-cdfAt(-10);m.l11_20=cdfAt(-10)-cdfAt(-20);m.l20=cdfAt(-20);\\n  const normalWin=1-cdfAt(0);\\n  for(const field of [\'p20\',\'p11_20\',\'p1_10\'])m[field]*=m.winProb/normalWin;\\n  for(const field of [\'l20\',\'l11_20\',\'l1_10\'])m[field]*=(1-m.winProb)/(1-normalWin);\\n  m.context=info;m.source=\'EuroLeague model + available roster + opponent strength\';\\n }\\n return true;\\n}\\nconst api={project,applyTeams,valid,key,tails};if(typeof module!==\'undefined\'&&module.exports)module.exports=api;root.MatchupContext=api;\\n})(typeof window!==\'undefined\'?window:globalThis);\\n", "matchup-context.js": "(async()=>{\\n\'use strict\';\\nconst pause=ms=>new Promise(r=>setTimeout(r,ms));\\nlet data=null;\\ntry{const res=await fetch(\'./data/matchup-context.json?t=\'+Date.now(),{cache:\'no-store\',...(typeof AbortSignal!==\'undefined\'&&AbortSignal.timeout?{signal:AbortSignal.timeout(10000)}:{})});if(res.ok)data=await res.json();}catch(e){console.warn(\'Matchup context unavailable\',e);}\\nfor(let i=0;i<450&&!window.__stabilityModelPatched;i++)await pause(100);\\nwindow.__matchupContextData=data;\\nif(!window.MatchupContext||typeof model!==\'function\'){window.__matchupContextReady=true;return;}\\nif(!MatchupContext.valid(data)){window.__matchupContextReady=true;console.warn(\'No fresh matchup context; existing model preserved\');return;}\\nconst escape=s=>String(s??\'\').replace(/[&<>\\"\']/g,c=>({\'&\':\'&amp;\',\'<\':\'&lt;\',\'>\':\'&gt;\',\'\\"\':\'&quot;\',\\"\'\\":\'&#39;\'}[c]));\\nconst n=v=>v==null||!Number.isFinite(Number(v))?\'\\u2014\':Number(v).toFixed(1);\\nconst percent=v=>v==null?\'\\u2014\':Math.round(v*100)+\'%\';\\nMatchupContext.applyTeams(MATCHUPS,data);\\nfor(const g of GAMES){const m=MATCHUPS[g.home];if(m?.context){g.homeMargin=m.margin;g.homeWinProb=m.winProb;g.awayWinProb=1-m.winProb;g.total=m.total;}}\\nconst previous=model;model=p=>MatchupContext.project(previous(p),p,data);\\nconst originalShow=window.showPlayer;\\nwindow.showPlayer=name=>{\\n originalShow(name);const p=players.find(p=>p.name===name),body=document.getElementById(\'modalBody\');if(!p||!body)return;\\n const x=model(p),c=x.context;if(!c)return;const profile=c.profile,a=profile?.averages,r=c.rival;\\n const section=document.createElement(\'section\');section.className=\'playerSection forecast-results context-player\';\\n section.innerHTML=`<h3 class=\\"sectionTitle\\">\\u05de\\u05e2\\u05d5\\u05e8\\u05d1\\u05d5\\u05ea, \\u05d4\\u05d2\\u05e0\\u05d4 \\u05d5\\u05ea\\u05e8\\u05d7\\u05d9\\u05e9\\u05d9 \\u05d3\\u05e7\\u05d5\\u05ea</h3>\\n <details open><summary>\\u05de\\u05e2\\u05d5\\u05e8\\u05d1\\u05d5\\u05ea \\u05d1\\u05d4\\u05ea\\u05e7\\u05e4\\u05d4</summary>${profile?`<p>${profile.games} \\u05de\\u05e9\\u05d7\\u05e7\\u05d9\\u05dd \\u05d1\\u05e2\\u05d5\\u05e0\\u05d4 \\u00b7 ${n(a.fieldGoalsAttempted2!=null&&a.fieldGoalsAttempted3!=null?a.fieldGoalsAttempted2+a.fieldGoalsAttempted3:null)} \\u05d6\\u05e8\\u05d9\\u05e7\\u05d5\\u05ea \\u05de\\u05d4\\u05e9\\u05d3\\u05d4, ${n(a.freeThrowsAttempted)} \\u05d6\\u05e8\\u05d9\\u05e7\\u05d5\\u05ea \\u05e2\\u05d5\\u05e0\\u05e9\\u05d9\\u05df, ${n(a.assistances)} \\u05d0\\u05e1\\u05d9\\u05e1\\u05d8\\u05d9\\u05dd \\u05d5\\u05be${n(a.turnovers)} \\u05d0\\u05d9\\u05d1\\u05d5\\u05d3\\u05d9\\u05dd \\u05dc\\u05de\\u05e9\\u05d7\\u05e7.</p><p>\\u05d7\\u05dc\\u05e7\\u05d5 \\u05d1\\u05d0\\u05d9\\u05e8\\u05d5\\u05e2\\u05d9 \\u05d4\\u05d4\\u05ea\\u05e7\\u05e4\\u05d4 \\u05d4\\u05e0\\u05de\\u05d3\\u05d3\\u05d9\\u05dd \\u05d1\\u05e7\\u05d1\\u05d5\\u05e6\\u05d4: ${percent(profile.offensiveShareProxy)} \\u00b7 \\u05e9\\u05d9\\u05e0\\u05d5\\u05d9 \\u05e0\\u05e4\\u05d7 \\u05d0\\u05d7\\u05e8\\u05d5\\u05df \\u05dc\\u05d3\\u05e7\\u05d4: ${profile.previousEventsPerMinute>0?percent(profile.recentEventsPerMinute/profile.previousEventsPerMinute-1):\'\\u05d0\\u05d9\\u05df \\u05de\\u05d3\\u05d2\\u05dd \\u05e7\\u05d5\\u05d3\\u05dd \\u05de\\u05e1\\u05e4\\u05d9\\u05e7\'}.</p>`:\'<p>\\u05d0\\u05d9\\u05df \\u05e0\\u05ea\\u05d5\\u05e0\\u05d9 \\u05de\\u05e2\\u05d5\\u05e8\\u05d1\\u05d5\\u05ea \\u05de\\u05d0\\u05d5\\u05de\\u05ea\\u05d9\\u05dd \\u05dc\\u05e9\\u05d7\\u05e7\\u05df.</p>\'}<p class=\\"muted\\">\\u05de\\u05d3\\u05d3 \\u05e0\\u05e4\\u05d7 \\u05d4\\u05de\\u05d1\\u05d5\\u05e1\\u05e1 \\u05e2\\u05dc \\u05d6\\u05e8\\u05d9\\u05e7\\u05d5\\u05ea, \\u05e2\\u05d5\\u05e0\\u05e9\\u05d9\\u05df \\u05d5\\u05d0\\u05d9\\u05d1\\u05d5\\u05d3\\u05d9\\u05dd; \\u05d0\\u05d9\\u05e0\\u05d5 USG% \\u05e8\\u05e9\\u05de\\u05d9. \\u05d4\\u05ea\\u05d0\\u05de\\u05d4 \\u05dc\\u05ea\\u05d7\\u05d6\\u05d9\\u05ea: ${n((c.involvementFactor-1)*100)}%.</p></details>\\n <details><summary>\\u05d4\\u05d2\\u05e0\\u05ea ${escape(c.opponent)} \\u05de\\u05d5\\u05dc \\u05e1\\u05d2\\u05e0\\u05d5\\u05df \\u05d4\\u05e9\\u05d7\\u05e7\\u05df</summary><p>${c.defenseSample} \\u05de\\u05e9\\u05d7\\u05e7\\u05d9\\u05dd \\u05d1\\u05de\\u05d3\\u05d2\\u05dd \\u00b7 \\u05d4\\u05ea\\u05d0\\u05de\\u05d4 \\u05dc\\u05e4\\u05d9 \\u05e7\\u05dc\\u05d9\\u05e2\\u05d4 \\u05e9\\u05d4\\u05d9\\u05e8\\u05d9\\u05d1\\u05d4 \\u05de\\u05d0\\u05e4\\u05e9\\u05e8\\u05ea \\u05dc\\u05e9\\u05ea\\u05d9 \\u05e0\\u05e7\\u05d5\\u05d3\\u05d5\\u05ea \\u05d5\\u05dc\\u05e9\\u05dc\\u05d5\\u05e9, \\u05de\\u05e9\\u05d5\\u05e7\\u05dc\\u05dc\\u05ea \\u05dc\\u05e4\\u05d9 \\u05e1\\u05d5\\u05d2 \\u05d4\\u05d6\\u05e8\\u05d9\\u05e7\\u05d5\\u05ea \\u05e9\\u05dc \\u05d4\\u05e9\\u05d7\\u05e7\\u05df: ${n((c.defenseFactor-1)*100)}%.</p>${r?`<p>\\u05d9\\u05e8\\u05d9\\u05d1 \\u05de\\u05e9\\u05d5\\u05e2\\u05e8 \\u05d1\\u05e2\\u05de\\u05d3\\u05d4 \\u05dc\\u05e4\\u05d9 \\u05d3\\u05e7\\u05d5\\u05ea: <b>${escape(r.name)}</b> \\u00b7 ${n(r.avgMinutes)} \\u05d3\\u05e7\\u05f3 \\u00b7 ${n(r.averages.steals)} \\u05d7\\u05d8\\u05d9\\u05e4\\u05d5\\u05ea \\u05d5\\u05be${n(r.averages.blocksFavour)} \\u05d7\\u05e1\\u05d9\\u05de\\u05d5\\u05ea \\u05dc\\u05de\\u05e9\\u05d7\\u05e7 \\u00b7 ${n(r.height)} \\u05e1\\u05f4\\u05de / ${n(r.weight)} \\u05e7\\u05f4\\u05d2.</p>`:\'\'}<p class=\\"muted\\">\\u05d6\\u05d4\\u05d5 \\u05d9\\u05e8\\u05d9\\u05d1 \\u05d1\\u05e2\\u05de\\u05d3\\u05d4, \\u05dc\\u05d0 \\u05d6\\u05d9\\u05d4\\u05d5\\u05d9 \\u05e9\\u05dc \\u05d4\\u05e9\\u05d5\\u05de\\u05e8 \\u05d1\\u05e4\\u05d5\\u05e2\\u05dc. \\u05d0\\u05d9\\u05df \\u05d1\\u05de\\u05e7\\u05d5\\u05e8 \\u05e0\\u05ea\\u05d5\\u05e0\\u05d9 \\u05d7\\u05d9\\u05dc\\u05d5\\u05e4\\u05d9\\u05dd, \\u05e9\\u05de\\u05d9\\u05e8\\u05d5\\u05ea \\u05d0\\u05d9\\u05e9\\u05d9\\u05d5\\u05ea \\u05d0\\u05d5 \\u05e9\\u05d9\\u05d8\\u05ea \\u05d4\\u05d2\\u05e0\\u05d4; \\u05e0\\u05ea\\u05d5\\u05e0\\u05d9 \\u05d4\\u05d9\\u05e8\\u05d9\\u05d1 \\u05d4\\u05d0\\u05d9\\u05e9\\u05d9\\u05d9\\u05dd \\u05de\\u05d5\\u05e6\\u05d2\\u05d9\\u05dd \\u05d5\\u05d0\\u05d9\\u05e0\\u05dd \\u05de\\u05e7\\u05d1\\u05dc\\u05d9\\u05dd \\u05de\\u05e7\\u05d3\\u05dd \\u05d4\\u05d2\\u05e0\\u05d4 \\u05de\\u05d5\\u05de\\u05e6\\u05d0.</p></details>\\n <details><summary>\\u05ea\\u05e8\\u05d7\\u05d9\\u05e9\\u05d9 \\u05d3\\u05e7\\u05d5\\u05ea</summary><table class=\\"lastThreeTable\\"><thead><tr><th>\\u05ea\\u05e8\\u05d7\\u05d9\\u05e9</th><th>\\u05d3\\u05e7\\u05d5\\u05ea</th><th>\\u05de\\u05e9\\u05e7\\u05dc</th><th>\\u05de\\u05e9\\u05d7\\u05e7\\u05d9 \\u05e2\\u05d1\\u05e8</th></tr></thead><tbody>${c.scenarios.map(s=>`<tr><td>${{close:\'\\u05de\\u05e9\\u05d7\\u05e7 \\u05e8\\u05d2\\u05d9\\u05dc / \\u05e6\\u05de\\u05d5\\u05d3\',\'big-win\':\'\\u05e0\\u05d9\\u05e6\\u05d7\\u05d5\\u05df \\u05d1\\u05be15+\',\'big-loss\':\'\\u05d4\\u05e4\\u05e1\\u05d3 \\u05d1\\u05be15+\'}[s.id]}</td><td>${n(s.minutes)}</td><td>${percent(s.weight)}</td><td>${s.observedGames}</td></tr>`).join(\'\')}</tbody></table><p class=\\"muted\\">\\u05de\\u05e9\\u05e7\\u05dc\\u05d9 \\u05ea\\u05e8\\u05d7\\u05d9\\u05e9 \\u05d4\\u05dd \\u05d0\\u05d5\\u05de\\u05d3\\u05df \\u05e0\\u05d5\\u05e1\\u05d7\\u05ea\\u05d9 \\u05e9\\u05d8\\u05e8\\u05dd \\u05db\\u05d5\\u05d9\\u05dc. ${c.minutesCorrectionActive?\'\\u05d4\\u05ea\\u05d0\\u05de\\u05ea \\u05d3\\u05e7\\u05d5\\u05ea \\u05de\\u05d5\\u05d2\\u05d1\\u05dc\\u05ea \\u05dc\\u05be8% \\u05dc\\u05e2\\u05d5\\u05de\\u05ea \\u05d4\\u05d1\\u05e1\\u05d9\\u05e1.\':\'\\u05e2\\u05d3 \\u05e9\\u05de\\u05d5\\u05e0\\u05d4 \\u05de\\u05e9\\u05d7\\u05e7\\u05d9\\u05dd, \\u05d4\\u05ea\\u05e8\\u05d7\\u05d9\\u05e9\\u05d9\\u05dd \\u05de\\u05e8\\u05d7\\u05d9\\u05d1\\u05d9\\u05dd \\u05d0\\u05ea \\u05d8\\u05d5\\u05d5\\u05d7 \\u05d4\\u05e1\\u05d9\\u05db\\u05d5\\u05df \\u05d5\\u05d0\\u05d9\\u05e0\\u05dd \\u05de\\u05e9\\u05e0\\u05d9\\u05dd \\u05d0\\u05ea \\u05de\\u05de\\u05d5\\u05e6\\u05e2 \\u05d4\\u05d3\\u05e7\\u05d5\\u05ea.\'}</p></details>\\n <p class=\\"notice\\">\\u05d4\\u05e9\\u05e4\\u05e2\\u05ea \\u05d4\\u05d4\\u05e8\\u05d7\\u05d1\\u05d4: ${c.pirChange>=0?\'+\':\'\'}${n(c.pirChange)} PIR \\u00b7 ${c.minutesChange>=0?\'+\':\'\'}${n(c.minutesChange)} \\u05d3\\u05e7\\u05d5\\u05ea. \\u05de\\u05e7\\u05d3\\u05de\\u05d9 \\u05d4\\u05d4\\u05e8\\u05d7\\u05d1\\u05d4 \\u05de\\u05d5\\u05d2\\u05d1\\u05dc\\u05d9\\u05dd \\u05d5\\u05d8\\u05e8\\u05dd \\u05e2\\u05d1\\u05e8\\u05d5 \\u05d0\\u05d9\\u05de\\u05d5\\u05ea \\u05d4\\u05d9\\u05e1\\u05d8\\u05d5\\u05e8\\u05d9.</p>`;\\n body.appendChild(section);\\n};\\nconst originalGames=renderGames;\\nrenderGames=function(){\\n originalGames();const cards=document.querySelectorAll(\'#gameCards .gameCard\');\\n GAMES.forEach((g,i)=>{\\n const card=cards[i],h=data.teams[g.home],a=data.teams[g.away];if(!card||!h||!a||MATCHUPS[g.home]?.context!==h)return;\\n const details=document.createElement(\'details\');details.className=\'secondaryDetails\';\\n const roster=t=>`<p><b>${escape(t===h?g.home:g.away)}</b>: ${t.availability.available} \\u05e4\\u05e2\\u05d9\\u05dc\\u05d9\\u05dd \\u05de\\u05ea\\u05d5\\u05da ${t.availability.rosterCount}. ${t.availability.missing.length?t.availability.missing.map(m=>`${escape(m.name)} (${m.status===\'out\'?\'\\u05d1\\u05d7\\u05d5\\u05e5\':\'\\u05d1\\u05e1\\u05e4\\u05e7\'}, ${n(m.avgMinutes)} \\u05d3\\u05e7\\u05f3)`).join(\' \\u00b7 \'):\'\\u05d0\\u05d9\\u05df \\u05d7\\u05d9\\u05e1\\u05d5\\u05e8\\u05d9\\u05dd \\u05de\\u05e1\\u05d5\\u05de\\u05e0\\u05d9\\u05dd\'}.</p>`;\\n const history=(t,name)=>`<p><b>${escape(name)}</b>: ${t.hardWins} \\u05e0\\u05d9\\u05e6\\u05d7\\u05d5\\u05e0\\u05d5\\u05ea \\u05de\\u05ea\\u05d5\\u05da ${t.hardGames} \\u05de\\u05e9\\u05d7\\u05e7\\u05d9\\u05dd \\u05e7\\u05e9\\u05d9\\u05dd \\u05d1\\u05e2\\u05d5\\u05e0\\u05d4.</p>${t.hardHistory.length?`<ul>${t.hardHistory.map(r=>`<li>${escape(r.opponent)} \\u00b7 ${r.home?\'\\u05d1\\u05d9\\u05ea\':\'\\u05d7\\u05d5\\u05e5\'} \\u00b7 ${r.won?\'\\u05e0\\u05d9\\u05e6\\u05d7\\u05d5\\u05df\':\'\\u05d4\\u05e4\\u05e1\\u05d3\'} \\u00b7 \\u05d4\\u05e4\\u05e8\\u05e9 ${n(r.margin)} \\u00b7 \\u05e1\\u05d9\\u05db\\u05d5\\u05d9 \\u05de\\u05d5\\u05e7\\u05d3\\u05dd ${percent(r.pregameWinProb)}</li>`).join(\'\')}</ul>`:\'\'}`;\\n const cal=data.calibration;\\n details.innerHTML=`<summary>\\u05e1\\u05d2\\u05dc \\u05d6\\u05de\\u05d9\\u05df, \\u05d9\\u05e8\\u05d9\\u05d1\\u05d5\\u05ea \\u05e7\\u05e9\\u05d5\\u05ea \\u05d5\\u05db\\u05d9\\u05d5\\u05dc</summary>${roster(h)}${roster(a)}<p>\\u05d4\\u05e9\\u05e4\\u05e2\\u05ea \\u05d4\\u05d7\\u05d9\\u05e1\\u05d5\\u05e8\\u05d9\\u05dd \\u05e2\\u05dc \\u05d4\\u05e4\\u05e8\\u05e9 \\u05d4\\u05d1\\u05d9\\u05ea: ${n(h.rosterDelta)} \\u00b7 \\u05ea\\u05d9\\u05e7\\u05d5\\u05df \\u05d7\\u05d5\\u05d6\\u05e7 \\u05d9\\u05e8\\u05d9\\u05d1\\u05d5\\u05ea: ${n(h.strengthDelta)} \\u05e0\\u05e7\\u05d5\\u05d3\\u05d5\\u05ea.</p>${history(h,g.home)}${history(a,g.away)}<p class=\\"muted\\">\\u05de\\u05e9\\u05d7\\u05e7 \\u05e7\\u05e9\\u05d4: \\u05e1\\u05d9\\u05db\\u05d5\\u05d9 \\u05de\\u05d5\\u05e7\\u05d3\\u05dd \\u05e9\\u05dc \\u05e2\\u05d3 40% \\u05dc\\u05e4\\u05d9 \\u05d3\\u05d9\\u05e8\\u05d5\\u05d2 \\u05e9\\u05e0\\u05d1\\u05e0\\u05d4 \\u05dc\\u05e4\\u05e0\\u05d9 \\u05d4\\u05de\\u05e9\\u05d7\\u05e7. \\u05ea\\u05d5\\u05e6\\u05d0\\u05d5\\u05ea \\u05d0\\u05dc\\u05d5 \\u05e0\\u05db\\u05e0\\u05e1\\u05d5\\u05ea \\u05dc\\u05d3\\u05d9\\u05e8\\u05d5\\u05d2 \\u05d7\\u05d5\\u05d6\\u05e7 \\u05d4\\u05d9\\u05e8\\u05d9\\u05d1\\u05d5\\u05ea; \\u05d0\\u05d9\\u05df \\u05ea\\u05d5\\u05e1\\u05e4\\u05ea \\u05db\\u05e4\\u05d5\\u05dc\\u05d4 \\u05e2\\u05dc \\u05d0\\u05d5\\u05ea\\u05d5 \\u05e0\\u05d9\\u05e6\\u05d7\\u05d5\\u05df. \\u05d4\\u05e9\\u05e4\\u05e2\\u05ea \\u05d4\\u05e1\\u05d2\\u05dc \\u05d4\\u05d9\\u05d0 \\u05d0\\u05d5\\u05de\\u05d3\\u05df \\u05de\\u05d5\\u05d2\\u05d1\\u05dc, \\u05dc\\u05d0 \\u05e4\\u05dc\\u05d5\\u05e1\\u05be\\u05de\\u05d9\\u05e0\\u05d5\\u05e1 \\u05e0\\u05de\\u05d3\\u05d3.</p><p><b>\\u05db\\u05d9\\u05d5\\u05dc: ${cal.active?\'\\u05e4\\u05e2\\u05d9\\u05dc \\u05dc\\u05d0\\u05d7\\u05e8 \\u05d1\\u05d3\\u05d9\\u05e7\\u05d4 \\u05db\\u05e8\\u05d5\\u05e0\\u05d5\\u05dc\\u05d5\\u05d2\\u05d9\\u05ea\':\'\\u05de\\u05de\\u05ea\\u05d9\\u05df \\u05dc\\u05de\\u05d3\\u05d2\\u05dd \\u05de\\u05d0\\u05d5\\u05de\\u05ea\'}</b> \\u00b7 ${cal.n} \\u05de\\u05e9\\u05d7\\u05e7\\u05d9\\u05dd \\u05e2\\u05dd \\u05ea\\u05d7\\u05d6\\u05d9\\u05ea \\u05de\\u05d5\\u05e7\\u05d3\\u05de\\u05ea \\u05e9\\u05dc \\u05d4\\u05d2\\u05e8\\u05e1\\u05d4 \\u05d4\\u05d6\\u05d5.</p>${cal.validationN?`<p>Brier \\u05d1\\u05d1\\u05d3\\u05d9\\u05e7\\u05d4: ${n(cal.baselineBrier)} \\u05dc\\u05e4\\u05e0\\u05d9 / ${n(cal.candidateBrier)} \\u05d0\\u05d7\\u05e8\\u05d9 \\u00b7 ${cal.validationN} \\u05de\\u05e9\\u05d7\\u05e7\\u05d9 \\u05d1\\u05d3\\u05d9\\u05e7\\u05d4.</p>`:\'\'}<table class=\\"lastThreeTable\\"><thead><tr><th>\\u05d0\\u05d7\\u05d5\\u05d6 \\u05d7\\u05d6\\u05d5\\u05d9</th><th>\\u05de\\u05e9\\u05d7\\u05e7\\u05d9\\u05dd</th><th>\\u05e0\\u05d9\\u05e6\\u05d7\\u05d5\\u05e0\\u05d5\\u05ea \\u05d1\\u05e4\\u05d5\\u05e2\\u05dc</th></tr></thead><tbody>${cal.bins.filter(b=>b.n).map(b=>`<tr><td>${b.from}\\u2013${b.to}%</td><td>${b.n}</td><td>${percent(b.observed)}</td></tr>`).join(\'\')||\'<tr><td colspan=\\"3\\">\\u05d0\\u05d9\\u05df \\u05e2\\u05d3\\u05d9\\u05d9\\u05df \\u05ea\\u05d7\\u05d6\\u05d9\\u05d5\\u05ea \\u05e9\\u05d4\\u05e1\\u05ea\\u05d9\\u05d9\\u05de\\u05d5 \\u05d1\\u05d2\\u05e8\\u05e1\\u05d4 \\u05d6\\u05d5</td></tr>\'}</tbody></table>`;\\n card.appendChild(details);\\n });\\n};\\nconst help=document.querySelector(\'#matchups .card>p\');if(help)help.textContent=\'\\u05d4\\u05e1\\u05ea\\u05d1\\u05e8\\u05d5\\u05d9\\u05d5\\u05ea \\u05de\\u05d5\\u05d3\\u05dc \\u05dc\\u05e4\\u05d9 \\u05ea\\u05d5\\u05e6\\u05d0\\u05d5\\u05ea, \\u05d1\\u05d9\\u05ea\\u05d9\\u05d5\\u05ea, \\u05d7\\u05d5\\u05d6\\u05e7 \\u05d9\\u05e8\\u05d9\\u05d1\\u05d5\\u05ea \\u05d5\\u05e1\\u05d2\\u05dc \\u05d6\\u05de\\u05d9\\u05df. \\u05db\\u05d9\\u05d5\\u05dc \\u05de\\u05d5\\u05e4\\u05e2\\u05dc \\u05e8\\u05e7 \\u05dc\\u05d0\\u05d7\\u05e8 \\u05e9\\u05d9\\u05e4\\u05d5\\u05e8 \\u05d1\\u05d1\\u05d3\\u05d9\\u05e7\\u05d4 \\u05e2\\u05dc \\u05de\\u05e9\\u05d7\\u05e7\\u05d9\\u05dd \\u05de\\u05d0\\u05d5\\u05d7\\u05e8\\u05d9\\u05dd; \\u05d4\\u05d0\\u05d7\\u05d5\\u05d6\\u05d9\\u05dd \\u05d0\\u05d9\\u05e0\\u05dd \\u05d9\\u05d7\\u05e1\\u05d9 \\u05e1\\u05d5\\u05db\\u05e0\\u05d5\\u05d9\\u05d5\\u05ea.\';\\nwindow.__matchupContextReady=true;\\nif(typeof renderAll===\'function\')renderAll();\\n})();\\n", "scripts/build_matchup_context.py": "\\"\\"\\"Observed context, pregame strength and calibration. No invented historical forecasts.\\"\\"\\"\\nimport argparse, json, math, statistics, urllib.request, unicodedata, re, hashlib\\nfrom pathlib import Path\\nfrom datetime import datetime, timezone, timedelta\\nfrom collections import defaultdict\\nfrom concurrent.futures import ThreadPoolExecutor\\n\\nROOT = Path(__file__).resolve().parents[1]\\nVERSION = \'matchup-context-v1\'\\nNOW = datetime.now(timezone.utc)\\n\\ndef load(path, default=None):\\n    try: return json.loads(Path(path).read_text())\\n    except (FileNotFoundError, json.JSONDecodeError): return default\\n\\ndef save(path, obj):\\n    Path(path).parent.mkdir(parents=True, exist_ok=True)\\n    Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2)+\'\\\\n\')\\n\\ndef number(x):\\n    try:\\n        n=float(x)\\n        return n if math.isfinite(n) else None\\n    except (ValueError, TypeError): return None\\n\\ndef clip(x,a,b): return max(a,min(b,x))\\ndef key(s):\\n    s=\'\'.join(c for c in unicodedata.normalize(\'NFKD\',str(s or \'\')) if not unicodedata.combining(c))\\n    return \' \'.join(sorted(re.sub(\'[^a-z0-9]+\',\' \',s.lower()).split()))\\ndef team(s):\\n    n=key(s)\\n    for needle,name in [(\'efes\',\'Anadolu Efes\'),(\'armani\',\'Milano\'),(\'milan\',\'Milano\'),(\'besiktas\',\'Besiktas\'),(\'crvena\',\'Crvena Zvezda\'),(\'dubai\',\'Dubai\'),(\'barcelona\',\'Barcelona\'),(\'bayern\',\'Bayern Munich\'),(\'fenerbahce\',\'Fenerbahce\'),(\'hapoel\',\'Hapoel Tel Aviv\'),(\'baskonia\',\'Baskonia\'),(\'asvel\',\'ASVEL\'),(\'maccabi\',\'Maccabi Tel Aviv\'),(\'olympiacos\',\'Olympiacos\'),(\'panathinaikos\',\'Panathinaikos\'),(\'paris\',\'Paris\'),(\'partizan\',\'Partizan\'),(\'real madrid\',\'Real Madrid\'),(\'valencia\',\'Valencia\'),(\'virtus\',\'Virtus Bologna\'),(\'zalgiris\',\'Zalgiris\'),(\'monaco\',\'Monaco\')]:\\n        if needle in n:return name\\n    return str(s or \'\')\\ndef stamp(s):\\n    try:\\n        d=datetime.fromisoformat(str(s).replace(\'Z\',\'+00:00\'))\\n        return d if d.tzinfo else None\\n    except ValueError:return None\\n\\ndef api(season, path):\\n    req=urllib.request.Request(f\'https://api-live.euroleague.net/v2/competitions/E/seasons/{season}/{path}\',headers={\'Accept\':\'application/json\',\'User-Agent\':\'EuroFantasy-Context/1.0\'})\\n    with urllib.request.urlopen(req,timeout=35) as response:return json.load(response)\\n\\ndef sigmoid(x):return 1/(1+math.exp(-clip(x,-30,30)))\\n\\ndef strength_history(games):\\n    \\"\\"\\"Opponent strength is frozen BEFORE each result; no look-ahead selection of hard games.\\"\\"\\"\\n    ratings=defaultdict(float); records=defaultdict(list); last_season=None\\n    for g in sorted(games,key=lambda g:(g[\'start\'],g[\'gameCode\'])):\\n        if g[\'season\']!=last_season:\\n            if last_season is not None:\\n                for t in ratings:ratings[t]*=.65\\n            last_season=g[\'season\']\\n        h,a=g[\'home\'],g[\'away\']; margin=ratings[h]-ratings[a]+3.2\\n        hp=sigmoid(margin/7.2); actual=g[\'homeScore\']-g[\'awayScore\']\\n        for t,o,p,d in [(h,a,hp,actual),(a,h,1-hp,-actual)]:\\n            if g[\'season\']==\'E2026\':records[t].append({\'opponent\':o,\'gameCode\':g[\'gameCode\'],\'date\':g[\'start\'],\'home\':t==h,\'pregameWinProb\':round(p,5),\'opponentRatingBefore\':round(ratings[o],3),\'hard\':p<=.4,\'won\':d>0,\'margin\':d})\\n        residual=clip(actual-margin,-25,25)\\n        ratings[h]=clip(ratings[h]+.10*residual,-24,24)\\n        ratings[a]=clip(ratings[a]-.10*residual,-24,24)\\n    return dict(ratings),dict(records)\\n\\nSTAT_FIELDS=[\'points\',\'valuation\',\'fieldGoalsAttempted2\',\'fieldGoalsMade2\',\'fieldGoalsAttempted3\',\'fieldGoalsMade3\',\'freeThrowsAttempted\',\'freeThrowsMade\',\'assistances\',\'turnovers\',\'steals\',\'blocksFavour\',\'totalRebounds\',\'foulsCommited\']\\ndef player_context(games, boxes, players):\\n    roster={key(p.get(\'name\')):p for p in players if p.get(\'pos\') in [\'G\',\'F\',\'C\']}\\n    logs=defaultdict(list); defense=defaultdict(list)\\n    for g in games:\\n        if g[\'season\']!=\'E2026\' or g[\'gameCode\'] not in boxes:continue\\n        box=boxes[g[\'gameCode\']]\\n        for side,t,opp in [(\'local\',g[\'home\'],g[\'away\']),(\'road\',g[\'away\'],g[\'home\'])]:\\n            shot=defaultdict(float);valid=defaultdict(int);played_rows=0\\n            for row in (box.get(side) or {}).get(\'players\',[]):\\n                person=(row.get(\'player\') or {}).get(\'person\') or {};s=row.get(\'stats\') or {}\\n                minutes=(number(s.get(\'timePlayed\')) or 0)/60\\n                if minutes<=0:continue\\n                played_rows+=1\\n                fields={f:number(s.get(f)) for f in STAT_FIELDS}\\n                for f in [\'fieldGoalsAttempted2\',\'fieldGoalsMade2\',\'fieldGoalsAttempted3\',\'fieldGoalsMade3\',\'freeThrowsAttempted\',\'freeThrowsMade\']:\\n                    if fields[f] is not None:shot[f]+=fields[f];valid[f]+=1\\n                k=key(person.get(\'name\'));p=roster.get(k)\\n                # Transfers: old-club observations cannot describe current role.\\n                if p and team(p.get(\'team\'))==t:\\n                    logs[k].append({\'gameCode\':g[\'gameCode\'],\'date\':g[\'start\'],\'team\':t,\'opponent\':opp,\'minutes\':minutes,\'margin\':g[\'homeScore\']-g[\'awayScore\'] if side==\'local\' else g[\'awayScore\']-g[\'homeScore\'],\'height\':number(person.get(\'height\')),\'weight\':number(person.get(\'weight\')),**fields})\\n            if played_rows and all(valid[f]==played_rows for f in [\'fieldGoalsAttempted2\',\'fieldGoalsMade2\',\'fieldGoalsAttempted3\',\'fieldGoalsMade3\']):\\n                defense[opp].append({f:shot[f] if valid[f] else None for f in [\'fieldGoalsAttempted2\',\'fieldGoalsMade2\',\'fieldGoalsAttempted3\',\'fieldGoalsMade3\',\'freeThrowsAttempted\',\'freeThrowsMade\']})\\n    profiles={};team_offense=defaultdict(list)\\n    for k,rows in logs.items():\\n        rows.sort(key=lambda r:(r[\'date\'],r[\'gameCode\']))\\n        sums={f:sum(r[f] for r in rows if r[f] is not None) for f in STAT_FIELDS}\\n        mins=sum(r[\'minutes\'] for r in rows)\\n        counts={f:sum(r[f] is not None for r in rows) for f in STAT_FIELDS}\\n        avg={f:sums[f]/counts[f] if counts[f] else None for f in STAT_FIELDS}\\n        complete=[r for r in rows if all(r[f] is not None for f in [\'fieldGoalsAttempted2\',\'fieldGoalsAttempted3\',\'freeThrowsAttempted\',\'turnovers\'])]\\n        events=lambda r:r[\'fieldGoalsAttempted2\']+r[\'fieldGoalsAttempted3\']+.44*r[\'freeThrowsAttempted\']+r[\'turnovers\']\\n        per_min=sum(events(r) for r in complete)/sum(r[\'minutes\'] for r in complete) if complete else None\\n        prev=complete[:-2]; recent=complete[-2:]\\n        ref=sum(events(r) for r in prev)/sum(r[\'minutes\'] for r in prev) if prev else None\\n        latest=sum(events(r) for r in recent)/sum(r[\'minutes\'] for r in recent) if recent else None\\n        p=roster[k]\\n        profiles[k]={\'name\':p[\'name\'],\'team\':team(p[\'team\']),\'pos\':p[\'pos\'],\'games\':len(rows),\'avgMinutes\':mins/len(rows),\'averages\':avg,\'shotEventsPerMinute\':per_min,\'recentEventsPerMinute\':latest,\'previousEventsPerMinute\':ref,\'recentGames\':len(recent),\'previousGames\':len(prev),\'minutesSd\':statistics.pstdev(r[\'minutes\'] for r in rows) if len(rows)>1 else None,\'height\':rows[-1][\'height\'],\'weight\':rows[-1][\'weight\'],\'logs\':rows[-10:]}\\n        team_offense[team(p[\'team\'])].append(k)\\n    for keys in team_offense.values():\\n        total=sum((profiles[k][\'shotEventsPerMinute\'] or 0)*profiles[k][\'avgMinutes\'] for k in keys)\\n        for k in keys:\\n            p=profiles[k];p[\'offensiveShareProxy\']=p[\'shotEventsPerMinute\']*p[\'avgMinutes\']/total if total and p[\'shotEventsPerMinute\'] is not None else None\\n    allowed={}\\n    for t,rows in defense.items():\\n        def summed(f):return sum(r[f] for r in rows if r[f] is not None)\\n        allowed[t]={\'games\':len(rows),\'attempts2\':summed(\'fieldGoalsAttempted2\'),\'made2\':summed(\'fieldGoalsMade2\'),\'attempts3\':summed(\'fieldGoalsAttempted3\'),\'made3\':summed(\'fieldGoalsMade3\')}\\n    all2=sum(x[\'attempts2\'] for x in allowed.values());all3=sum(x[\'attempts3\'] for x in allowed.values())\\n    league={\'rate2\':sum(x[\'made2\'] for x in allowed.values())/all2 if all2 else None,\'rate3\':sum(x[\'made3\'] for x in allowed.values())/all3 if all3 else None}\\n    return profiles,allowed,league\\n\\ndef availability(players, profiles, t):\\n    roster=[p for p in players if team(p.get(\'team\'))==t and p.get(\'pos\') in [\'G\',\'F\',\'C\']]\\n    impacts=[]\\n    for p in roster:\\n        if p.get(\'status\') not in [\'out\',\'questionable\']:continue\\n        profile=profiles.get(key(p[\'name\'])); price=number(p.get(\'price\')) or 0\\n        mins=profile[\'avgMinutes\'] if profile else (27 if price>=14 else 23 if price>=10 else 19 if price>=7 else 14)\\n        missing=1 if p[\'status\']==\'out\' else 1-clip(number(p.get(\'probability_of_playing\')) if number(p.get(\'probability_of_playing\')) is not None else .5,0,1)\\n        impact=clip((price-5)/10,0,1.5)*mins/25*missing\\n        impacts.append({\'name\':p[\'name\'],\'status\':p[\'status\'],\'missingProbability\':missing,\'avgMinutes\':round(mins,2),\'sampleGames\':profile[\'games\'] if profile else 0,\'impactProxy\':round(impact,3)})\\n    return {\'missing\':impacts,\'marginPenalty\':round(clip(sum(x[\'impactProxy\'] for x in impacts),0,3),3),\'available\':sum(p.get(\'status\')==\'active\' for p in roster),\'rosterCount\':len(roster)}\\n\\ndef calibrate(records):\\n    rows=sorted(records,key=lambda r:r[\'date\'])\\n    def score(data,a,b):return sum((sigmoid(a+b*r[\'logit\'])-r[\'won\'])**2 for r in data)/len(data)\\n    # Reliability buckets retain every frozen forecast, including this model version.\\n    bins=[]\\n    for lo in range(0,100,10):\\n        group=[r for r in rows if lo/100<=r[\'rawProb\']<(lo+10)/100 or (lo==90 and r[\'rawProb\']==1)]\\n        bins.append({\'from\':lo,\'to\':lo+10,\'n\':len(group),\'predicted\':sum(r[\'rawProb\'] for r in group)/len(group) if group else None,\'observed\':sum(r[\'won\'] for r in group)/len(group) if group else None})\\n    report={\'active\':False,\'n\':len(rows),\'bins\':bins,\'modelVersion\':VERSION,\'reason\':\'needs-100-frozen-games\',\'coefficients\':{\'intercept\':0,\'slope\':1}}\\n    if len(rows)<100:return report\\n    split=int(len(rows)*.65);train,test=rows[:split],rows[split:]\\n    # Keep all games on a date in the same split.\\n    boundary=test[0][\'date\'][:10];train=[r for r in rows if r[\'date\'][:10]<boundary];test=[r for r in rows if r[\'date\'][:10]>=boundary]\\n    if len(train)<60 or len(test)<30 or len({r[\'date\'][:10] for r in test})<6:return report\\n    a,b=0.,1.\\n    for _ in range(1200):\\n        errors=[sigmoid(a+b*r[\'logit\'])-r[\'won\'] for r in train]\\n        a-=.04*(sum(errors)/len(train)+.02*a)\\n        b-=.04*(sum(e*r[\'logit\'] for e,r in zip(errors,train))/len(train)+.02*(b-1))\\n        a=clip(a,-1,1);b=clip(b,.4,1.8)\\n    base=score(test,0,1);candidate=score(test,a,b)\\n    report.update({\'trainN\':len(train),\'validationN\':len(test),\'baselineBrier\':base,\'candidateBrier\':candidate,\'coefficients\':{\'intercept\':a,\'slope\':b},\'active\':candidate<base*.98,\'reason\':\'validated\' if candidate<base*.98 else \'no-held-out-improvement\'})\\n    return report\\n\\ndef build(root=ROOT,offline=False):\\n    warnings=[];all_games=[]\\n    model_version=VERSION+\':\'+hashlib.sha256(b\'\'.join((root/p).read_bytes() for p in [\'matchup-context-core.js\',\'scripts/build_matchup_context.py\',\'personal-model-core.js\',\'.github/workflows/matchups-live.yml\'] if (root/p).exists())).hexdigest()[:16]\\n    for season in [\'E2025\',\'E2026\']:\\n        cache=root/f\'data/context/{season}-schedule.json\'\\n        try:\\n            payload=load(cache) if offline else api(season,\'games?limit=500\')\\n            if not payload:raise RuntimeError(\'No schedule cache\')\\n            if not offline:save(cache,payload)\\n        except Exception as e:\\n            payload=load(cache,{\'data\':[]});warnings.append(f\'{season}: schedule unavailable ({type(e).__name__})\')\\n        for g in payload.get(\'data\',[]):\\n            start=stamp(g.get(\'utcDate\'));hs=number((g.get(\'local\') or {}).get(\'score\'));rs=number((g.get(\'road\') or {}).get(\'score\'))\\n            if not start or start>=NOW or not g.get(\'played\') or hs is None or rs is None:continue\\n            all_games.append({\'season\':season,\'gameCode\':int(g[\'gameCode\']),\'start\':start.isoformat(),\'home\':team(g[\'local\'][\'club\'][\'name\']),\'away\':team(g[\'road\'][\'club\'][\'name\']),\'homeScore\':hs,\'awayScore\':rs})\\n    boxes={};current=[g for g in all_games if g[\'season\']==\'E2026\']\\n    def read_box(g):\\n        path=root/f\'data/backtest/cache/E2026-{g[\\"gameCode\\"]}-stats.json\';box=load(path)\\n        if box is None and not offline:\\n            try:box=api(\'E2026\',f\'games/{g[\\"gameCode\\"]}/stats\');save(path,box)\\n            except Exception:return g[\'gameCode\'],None\\n        return g[\'gameCode\'],box\\n    with ThreadPoolExecutor(max_workers=4) as pool:\\n        for code,box in pool.map(read_box,current):\\n            if box:boxes[code]=box\\n            else:warnings.append(f\'Box missing: E2026-{code}\')\\n    players=load(root/\'data/players.json\',[])\\n    profiles,allowed,league=player_context(current,boxes,players)\\n    ratings,records=strength_history(all_games)\\n    matches=load(root/\'data/matchups.json\',{}).get(\'matchups\',{})\\n    teaminfo={}\\n    for t in {team(p.get(\'team\')) for p in players}:\\n        games=records.get(t,[]);hard=[g for g in games if g[\'hard\']]\\n        teaminfo[t]={\'availability\':availability(players,profiles,t),\'rating\':ratings.get(t,0),\'currentGames\':len(games),\'hardGames\':len(hard),\'hardWins\':sum(g[\'won\'] for g in hard),\'hardHistory\':hard,\'recentHistory\':games[-5:]}\\n    snapshots=root/\'data/context/team-snapshots\';snapshots.mkdir(parents=True,exist_ok=True)\\n    actual={(g[\'season\'],g[\'gameCode\']):g for g in all_games}\\n    evaluated=[]\\n    for path in snapshots.glob(\'*.json\'):\\n        s=load(path,{});g=actual.get((\'E2026\',s.get(\'gameCode\')))\\n        if not g or s.get(\'modelVersion\')!=model_version or not stamp(s.get(\'created_at\')) or stamp(s[\'created_at\'])>=stamp(g[\'start\']):continue\\n        p=number(s.get(\'rawProb\'))\\n        if p is None or not 0<p<1:continue\\n        evaluated.append({\'gameCode\':g[\'gameCode\'],\'date\':g[\'start\'],\'rawProb\':p,\'logit\':math.log(p/(1-p)),\'won\':int(g[\'homeScore\']>g[\'awayScore\'])})\\n    calibration=calibrate(evaluated)\\n    calibration[\'modelVersion\']=model_version\\n    for t,m in matches.items():\\n        t=team(t);o=team(m.get(\'opponent\'))\\n        if t not in teaminfo or o not in teaminfo:continue\\n        # Opponent-adjusted margin shrinks toward existing model. Ratings require observed games.\\n        strength_margin=ratings.get(t,0)-ratings.get(o,0)+(3.2 if m.get(\'home\') else -3.2)\\n        sample=min(teaminfo[t][\'currentGames\'],teaminfo[o][\'currentGames\'])\\n        strength_delta=clip((strength_margin-(number(m.get(\'margin\')) or 0))*.25*sample/(sample+6),-2,2)\\n        roster_delta=teaminfo[o][\'availability\'][\'marginPenalty\']-teaminfo[t][\'availability\'][\'marginPenalty\']\\n        margin=(number(m.get(\'margin\')) or 0)+strength_delta+roster_delta\\n        raw=sigmoid(margin/7.2);c=calibration[\'coefficients\'];served=sigmoid((c[\'intercept\'] if m.get(\'home\') else -c[\'intercept\'])+c[\'slope\']*math.log(raw/(1-raw))) if calibration[\'active\'] else raw\\n        teaminfo[t].update({\'opponent\':o,\'home\':bool(m.get(\'home\')),\'baseMargin\':m.get(\'margin\'),\'strengthDelta\':round(strength_delta,4),\'rosterDelta\':round(roster_delta,4),\'margin\':round(margin,4),\'rawWinProb\':raw,\'winProb\':served})\\n    # Save forecasts only before kickoff; never manufacture predictions for played games.\\n    schedule=load(root/\'data/learning/schedule.json\',{})\\n    for g in schedule.values():\\n        start=stamp(g.get(\'start\'));t=team(g.get(\'home\'));o=team(g.get(\'away\'));m=teaminfo.get(t,{})\\n        if not start or g.get(\'played\') or not NOW+timedelta(minutes=10)<start<=NOW+timedelta(hours=24):continue\\n        if m.get(\'opponent\')!=o or m.get(\'home\') is not True:continue\\n        path=snapshots/f\'E2026-{g[\\"gameCode\\"]}.json\'\\n        if not path.exists():save(path,{\'modelVersion\':model_version,\'gameCode\':g[\'gameCode\'],\'home\':t,\'away\':o,\'kickoff\':g[\'start\'],\'created_at\':NOW.isoformat(),\'rawProb\':m[\'rawWinProb\'],\'servedProb\':m[\'winProb\'],\'margin\':m[\'margin\'],\'strengthDelta\':m[\'strengthDelta\'],\'rosterDelta\':m[\'rosterDelta\']})\\n    result={\'schema\':VERSION,\'modelVersion\':model_version,\'season\':\'E2026\',\'updated_at\':NOW.isoformat(),\'players\':profiles,\'defense\':allowed,\'league\':league,\'teams\':teaminfo,\'calibration\':calibration,\'warnings\':warnings,\'currentGames\':len(current),\'boxGames\':len(boxes)}\\n    # A failed scheduled API fetch must not wipe a previous usable dataset.\\n    if not current or not profiles:\\n        if (root/\'data/matchup-context.json\').exists():raise RuntimeError(\'Context refresh incomplete; preserving previous dataset\')\\n        raise RuntimeError(\'No current-season observations; context cannot be built\')\\n    save(root/\'data/matchup-context.json\',result)\\n    print(f\'Context: {len(profiles)} players, {len(current)} games, {len(boxes)} boxes; calibration {len(evaluated)} frozen games\')\\n    return result\\n\\nif __name__==\'__main__\':\\n    parser=argparse.ArgumentParser();parser.add_argument(\'--offline\',action=\'store_true\');args=parser.parse_args();build(offline=args.offline)\\n", "tests/test_matchup_context.py": "import sys, unittest, tempfile, json\\nfrom pathlib import Path\\nfrom datetime import timedelta\\nsys.path.insert(0,str(Path(__file__).resolve().parents[1]/\'scripts\'))\\nimport build_matchup_context as m\\n\\nclass ContextTests(unittest.TestCase):\\n def test_hard_games_use_only_prior_results(self):\\n  base={\'season\':\'E2026\',\'home\':\'A\',\'away\':\'B\',\'homeScore\':120,\'awayScore\':60}\\n  games=[{**base,\'gameCode\':i,\'start\':f\'2026-09-{i+1:02d}T12:00:00+00:00\'} for i in range(6)]\\n  _,r=m.strength_history(games)\\n  _,past=m.strength_history(games[:3])\\n  self.assertEqual(r[\'B\'][:3],past[\'B\'])\\n  self.assertTrue(any(g[\'hard\'] for g in r[\'B\']))\\n  self.assertEqual(r[\'A\'][0][\'pregameWinProb\'],round(m.sigmoid(3.2/7.2),5))\\n def test_calibration_waits_and_rejects_no_gain(self):\\n  self.assertFalse(m.calibrate([])[\'active\'])\\n  rows=[{\'date\':f\'2026-01-{i//8+1:02d}\',\'rawProb\':.5,\'logit\':0,\'won\':i%2} for i in range(160)]\\n  r=m.calibrate(rows)\\n  self.assertFalse(r[\'active\'])\\n  self.assertGreaterEqual(r[\'validationN\'],30)\\n  self.assertEqual(sum(b[\'n\'] for b in r[\'bins\']),160)\\n def test_calibration_can_validate_overconfidence(self):\\n  rows=[{\'date\':f\'2026-01-{i//10+1:02d}\',\'rawProb\':.9,\'logit\':m.math.log(9),\'won\':int(i%10<6)} for i in range(200)]\\n  r=m.calibrate(rows)\\n  self.assertTrue(r[\'active\'])\\n  self.assertLess(r[\'candidateBrier\'],r[\'baselineBrier\']*.98)\\n def test_availability_not_assumed_active(self):\\n  roster=[{\'name\':\'X\',\'team\':\'A\',\'pos\':\'C\',\'price\':18,\'status\':\'out\'},{\'name\':\'Y\',\'team\':\'A\',\'pos\':\'G\',\'price\':18,\'status\':\'questionable\',\'probability_of_playing\':1}]\\n  a=m.availability(roster,{},\'A\')\\n  self.assertGreater(a[\'marginPenalty\'],0);self.assertLessEqual(a[\'marginPenalty\'],3)\\n  self.assertEqual(a[\'missing\'][1][\'impactProxy\'],0)\\n def test_box_stats_real_and_missing_distinct(self):\\n  root=Path(__file__).resolve().parents[1]\\n  fixture=m.load(root/\'data/backtest/cache/E2026-40-stats.json\')\\n  roster=[{\'name\':\'Sasha Vezenkov\',\'team\':\'Olympiacos\',\'pos\':\'F\'}]\\n  game={\'season\':\'E2026\',\'gameCode\':40,\'start\':\'2026-10-09T18:15:00+00:00\',\'home\':\'Olympiacos\',\'away\':\'Anadolu Efes\',\'homeScore\':89,\'awayScore\':66}\\n  profiles,allowed,league=m.player_context([game],{40:fixture},roster)\\n  p=profiles[m.key(\'Sasha Vezenkov\')]\\n  self.assertEqual(p[\'averages\'][\'valuation\'],7)\\n  self.assertEqual(p[\'averages\'][\'points\'],9)\\n  self.assertEqual(p[\'averages\'][\'assistances\'],0)\\n  self.assertAlmostEqual(p[\'avgMinutes\'],21.7)\\n  self.assertEqual(p[\'averages\'][\'fieldGoalsAttempted2\'],5)\\n  self.assertEqual(allowed[\'Anadolu Efes\'][\'attempts2\'],47)\\n  self.assertGreater(league[\'rate2\'],0)\\n  for row in fixture[\'local\'][\'players\']:row[\'stats\'].pop(\'fieldGoalsMade2\',None)\\n  _,allowed,_=m.player_context([game],{40:fixture},roster)\\n  self.assertNotIn(\'Anadolu Efes\',allowed)\\n def test_no_postgame_snapshot_or_overwrite(self):\\n  with tempfile.TemporaryDirectory() as d:\\n   root=Path(d);future=m.NOW+timedelta(hours=2);past=m.NOW-timedelta(days=1)\\n   games=[{\'gameCode\':1,\'played\':True,\'utcDate\':past.isoformat(),\'local\':{\'club\':{\'name\':\'A\'},\'score\':90},\'road\':{\'club\':{\'name\':\'B\'},\'score\':80}}]\\n   stats={k:0 for k in m.STAT_FIELDS};stats.update(timePlayed=1200,valuation=10,fieldGoalsAttempted2=5,fieldGoalsMade2=3)\\n   box={\'local\':{\'players\':[{\'player\':{\'person\':{\'name\':\'X\'}},\'stats\':stats}]},\'road\':{\'players\':[{\'player\':{\'person\':{\'name\':\'Y\'}},\'stats\':stats}]}}\\n   for path,obj in [(\'data/context/E2026-schedule.json\',{\'data\':games}),(\'data/context/E2025-schedule.json\',{\'data\':[]}),(\'data/players.json\',[{\'name\':\'X\',\'team\':\'A\',\'pos\':\'C\',\'status\':\'active\',\'price\':10},{\'name\':\'Y\',\'team\':\'B\',\'pos\':\'C\',\'status\':\'active\',\'price\':10}]),(\'data/backtest/cache/E2026-1-stats.json\',box),(\'data/matchups.json\',{\'matchups\':{\'A\':{\'opponent\':\'B\',\'home\':True,\'margin\':3},\'B\':{\'opponent\':\'A\',\'home\':False,\'margin\':-3}}}),(\'data/learning/schedule.json\',{\'1\':{\'gameCode\':1,\'home\':\'A\',\'away\':\'B\',\'played\':True,\'start\':past.isoformat()},\'2\':{\'gameCode\':2,\'home\':\'A\',\'away\':\'B\',\'played\':False,\'start\':future.isoformat()}})]:m.save(root/path,obj)\\n   j=m.build(root,offline=True)\\n   self.assertAlmostEqual(j[\'teams\'][\'A\'][\'winProb\']+j[\'teams\'][\'B\'][\'winProb\'],1)\\n   snaps=root/\'data/context/team-snapshots\';self.assertFalse((snaps/\'E2026-1.json\').exists())\\n   before=(snaps/\'E2026-2.json\').read_bytes();m.build(root,offline=True);self.assertEqual(before,(snaps/\'E2026-2.json\').read_bytes())\\n\\nif __name__==\'__main__\':unittest.main()\\n", "tests/test_matchup_context.cjs": "const assert=require(\'node:assert/strict\');\\nconst core=require(\'../matchup-context-core.js\');\\nconst data={schema:\'matchup-context-v1\',season:\'E2026\',updated_at:new Date().toISOString(),players:{},defense:{},league:{},teams:{}};\\nconst p={name:\'X\',team:\'A\',opponent:\'B\',pos:\'C\',price:15,status:\'active\'};\\nconst base={expected:25,minutes:25,floor:10,ceiling:35,match:{opponent:\'B\',margin:5,winProb:.65},learning:{}};\\nassert.deepEqual(core.project(base,p,{}),base);\\nassert.deepEqual(core.project(base,{...p,status:\'out\'},data),base);\\nlet x=core.project(base,p,data);assert.equal(x.expected,25);assert.equal(x.minutes,25);\\nassert.ok(Math.abs(x.context.scenarios.reduce((s,r)=>s+r.weight,0)-1)<1e-8);\\nassert.ok(x.floor<=x.expected&&x.ceiling>=x.expected);\\nassert.ok(!x.context.minutesCorrectionActive);\\nassert.equal(core.valid({...data,updated_at:\'2020-01-01\'}),false);\\ndata.players[core.key(\'X\')]={name:\'X\',team:\'A\',pos:\'C\',games:10,avgMinutes:25,previousGames:8,recentGames:2,previousEventsPerMinute:.5,recentEventsPerMinute:1,averages:{fieldGoalsAttempted2:8,fieldGoalsAttempted3:3},logs:Array.from({length:10},(_,i)=>({minutes:i<5?29:20,margin:i<5?5:20}))};\\ndata.league={rate2:.5,rate3:.35};data.defense.B={games:10,made2:30,attempts2:100,made3:10,attempts3:100};\\nx=core.project(base,p,data);assert.ok(x.context.defenseFactor<1);assert.ok(x.context.involvementFactor>1);assert.ok(x.minutes>=23&&x.minutes<=27);assert.ok(x.context.minutesCorrectionActive);\\nconst matches={A:{opponent:\'B\',home:true,margin:5,total:170},B:{opponent:\'A\',home:false,margin:-5,total:170}};\\ndata.teams={A:{opponent:\'B\',home:true,margin:3,winProb:.6},B:{opponent:\'A\',home:false,margin:-3,winProb:.4}};\\ncore.applyTeams(matches,data);assert.equal(matches.A.winProb+matches.B.winProb,1);\\nfor(const m of Object.values(matches)){\\n assert.ok(Math.abs(m.p1_10+m.p11_20+m.p20-m.winProb)<1e-8);\\n assert.ok(Math.abs(m.l1_10+m.l11_20+m.l20-(1-m.winProb))<1e-8);\\n}\\nconst once=JSON.stringify(matches);core.applyTeams(matches,data);assert.equal(JSON.stringify(matches),once);\\nconst staleFixture={...data,teams:{A:{opponent:\'OTHER\',home:true,margin:20,winProb:.9}}};core.applyTeams(matches,staleFixture);assert.equal(matches.A.margin,3);\\nconsole.log(\'Context core: bounded effects, missing/stale fallback, coherent probabilities and idempotence passed\');\\n", "tests/test_context_browser.cjs": "const fs=require(\'node:fs\'),vm=require(\'node:vm\'),assert=require(\'node:assert/strict\');\\nconst extension=require(\'../matchup-context-core.js\');\\n(async()=>{\\n const data=JSON.parse(fs.readFileSync(\'data/matchup-context.json\'));\\n const players=JSON.parse(fs.readFileSync(\'data/players.json\'));\\n const matches=JSON.parse(fs.readFileSync(\'data/matchups.json\')).matchups;\\n const games=Object.entries(matches).filter(([,m])=>m.home).map(([home,m])=>({home,away:m.opponent,total:m.total,homeMargin:m.margin}));\\n const sections=[],cards=games.map(()=>({appendChild:x=>sections.push(x)}));let modal=[];\\n const help={textContent:\'\'};let ready=false;\\n const sandbox={console,MatchupContext:extension,players,MATCHUPS:matches,GAMES:games,\\n window:{MatchupContext:extension,__stabilityModelPatched:true,__learningReady:false,showPlayer:()=>{modal=[];}},\\n fetch:async()=>({ok:true,json:async()=>data}),\\n document:{getElementById:id=>id===\'modalBody\'?{appendChild:x=>modal.push(x)}:null,createElement:()=>({innerHTML:\'\',className:\'\'}),querySelectorAll:()=>cards,querySelector:()=>help},\\n renderGames:()=>{},renderAll:()=>sandbox.renderGames(),setTimeout,\\n model:p=>({expected:20,minutes:24,floor:9,ceiling:30,source:\'test\',match:matches[p.team]||{opponent:p.opponent,margin:0,winProb:.5}})};\\n vm.createContext(sandbox);await vm.runInContext(fs.readFileSync(\'matchup-context.js\',\'utf8\'),sandbox);\\n assert.ok(sandbox.window.__matchupContextReady);assert.ok(help.textContent.includes(\'\\u05d0\\u05d9\\u05e0\\u05dd \\u05d9\\u05d7\\u05e1\\u05d9 \\u05e1\\u05d5\\u05db\\u05e0\\u05d5\\u05d9\\u05d5\\u05ea\'));\\n sandbox.window.showPlayer(\'Sasha Vezenkov\');assert.equal(modal.length,1);\\n assert.ok(modal[0].innerHTML.includes(\'\\u05de\\u05e2\\u05d5\\u05e8\\u05d1\\u05d5\\u05ea \\u05d1\\u05d4\\u05ea\\u05e7\\u05e4\\u05d4\'));\\n assert.ok(modal[0].innerHTML.includes(\'\\u05ea\\u05e8\\u05d7\\u05d9\\u05e9\\u05d9 \\u05d3\\u05e7\\u05d5\\u05ea\'));\\n assert.ok(!modal[0].innerHTML.includes(\'NaN\'));assert.ok(!modal[0].innerHTML.includes(\'undefined\'));\\n assert.ok(sections.some(s=>s.innerHTML.includes(\'\\u05de\\u05de\\u05ea\\u05d9\\u05df \\u05dc\\u05de\\u05d3\\u05d2\\u05dd \\u05de\\u05d0\\u05d5\\u05de\\u05ea\')));\\n console.log(\'Browser integration VM: load ordering, player dialog and team detail content passed\');\\n})();\\n"}')
          for name,content in payload.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
          p=Path('index.html');s=p.read_text()
          tag='<script>window.__matchupContextEnabled=true;</script><script src="./matchup-context-core.js?v=1"></script><script src="./matchup-context.js?v=1"></script>'
          if 'src="./matchup-context.js' not in s:
              anchor='<script src="./learning-model-version.js">'
              if anchor not in s:raise RuntimeError('Learning integration missing; install the existing personal model first')
              s=s.replace(anchor,tag+anchor,1)
          s=s.replace('Win% ללא מרווח סוכנות מה-moneyline. 11+/20+ הם אומדן מודל מה-spread, לא הסתברות רשמית.','הסתברויות מודל לפי תוצאות, ביתיות, סגל זמין וחוזק יריבות. כיול מופעל רק אחרי בדיקה כרונולוגית; האחוזים אינם יחסי סוכנויות.')
          p.write_text(s)
          p=Path('learning.js');s=p.read_text()
          if 'window.__matchupContextEnabled' not in s:
              old='!window.__stabilityModelPatched;i++'
              if old not in s:raise RuntimeError('Learning startup changed; refusing an unsafe patch')
              s=s.replace(old,'(!window.__stabilityModelPatched || (window.__matchupContextEnabled && !window.__matchupContextReady));i++',1)
          p.write_text(s)
          p=Path('scripts/fantasy_learning.py');s=p.read_text()
          if "'matchup-context-core.js'" not in s:
              old="'personal-model.js','data/player-history.json'"
              if old not in s:raise RuntimeError('Model fingerprint list changed')
              s=s.replace(old,"'personal-model.js','matchup-context-core.js','matchup-context.js','data/player-history.json'",1)
          p.write_text(s)
          p=Path('scripts/forecast_players.cjs');s=p.read_text()
          if 'const extension =' not in s:
              s=s.replace("const core = require('../personal-model-core.js');", "const core = require('../personal-model-core.js');\nconst extension = require('../matchup-context-core.js');",1)
              s=s.replace("'model-stability.js','personal-model-core.js','personal-model.js','data/player-history.json'", "'model-stability.js','personal-model-core.js','personal-model.js','matchup-context-core.js','matchup-context.js','data/player-history.json'",1)
              s=s.replace("const matches = load('data/matchups.json').matchups || {};", "const matches = load('data/matchups.json').matchups || {};\nconst matchupContext = load('data/matchup-context.json');\nextension.applyTeams(matches, matchupContext);",1)
              old="core.calibrate(core.project(p, r, h, context, history.config), p, learning, modelId)"
              if old not in s:raise RuntimeError('Shared prediction path changed')
              s=s.replace(old,"core.calibrate(extension.project({...core.project(p, r, h, context, history.config),match}, p, matchupContext), p, learning, modelId)",1)
          p.write_text(s)
          p=Path('scripts/snapshot_live_model.py');s=p.read_text()
          if 'window.__matchupContextReady' not in s:
