name: Publish verified demo test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-demo-test.yml']

permissions:
  contents: read

concurrency:
  group: pages-test
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rotemkimi-byte/eurofantasy-ai-demo-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Validate and copy only the tested public snapshot
        shell: bash
        run: |
          set -euo pipefail
          export DIST="$RUNNER_TEMP/eurofantasy-public-dist"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          dist = pathlib.Path(os.environ['DIST']).resolve()
          assert root not in dist.parents and not dist.exists()
          manifest_file = root / '.github/demo-manifest.json'
          assert hashlib.sha256(manifest_file.read_bytes()).hexdigest() == '8b5d6b4a13fd1c57d70f540d6d934e5d5820e18db3230dc3ec839cc93908bd97'
          manifest = json.loads(manifest_file.read_text())
          allowed = {record['path'] for record in manifest['files']} | {'.nojekyll'}
          assert len(allowed) == 256
          tracked = set(subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z']).decode().split('\0')) - {''}
          metadata = {'README.md', '.github/demo-manifest.json', '.github/workflows/seed-demo-test.yml', '.github/workflows/publish-demo-test.yml', '.github/workflows/seed-private-dev.yml', '.github/workflows/verify-private-refresh.yml'}
          assert tracked == allowed | metadata
          dist.mkdir()
          for record in manifest['files']:
              name = record['path']
              source = root / name
              assert source.is_file() and source.resolve() == source and root in source.parents
              assert source.stat().st_size == record['bytes']
              assert hashlib.sha256(source.read_bytes()).hexdigest() == record['sha256']
              target = dist / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          (dist / '.nojekyll').touch()
          assert {f.relative_to(dist).as_posix() for f in dist.rglob('*') if f.is_file()} == allowed
          print('Verified 255 public runtime files; deployment metadata excluded.')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/eurofantasy-public-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for verified Pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 6; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, name: 'github-pages', per_page: 100
              });
              const artifacts = data.artifacts.filter(a => a.name === 'github-pages' && !a.expired);
              if (artifacts.length === 1) return;
              if (artifacts.length > 1) throw new Error('Multiple Pages artifacts');
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Verified Pages artifact not available');
      - uses: actions/deploy-pages@v4
        id: deployment
