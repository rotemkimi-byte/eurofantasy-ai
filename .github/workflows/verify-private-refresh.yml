name: Verify private source calculations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-private-refresh.yml']

permissions:
  contents: read

concurrency:
  group: private-refresh-test
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'rotemkimi-byte/eurofantasy-ai-demo-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rotemkimi-byte/eurofantasy-ai-dev-test
          ref: main
          path: private
          token: ${{ secrets.DEV_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recalculate and validate an existing EuroLeague data pipeline
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          if (node scripts/build-position-defense.cjs && node tests/test_position_defense.cjs && python scripts/build_player_identities.py && node scripts/audit_player_identities.cjs) > "$RUNNER_TEMP/private-calculation.log" 2>&1; then
            echo 'Position-defense calculation and identity checks passed.'
          else
            echo 'Private calculation did not pass; no data published.'
            exit 1
          fi
      - name: Test fresh-data publication and reject private development files
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          if (python scripts/build_public_dist.py "$GITHUB_WORKSPACE/private" "$RUNNER_TEMP/private-refresh-public-dist" "$RUNNER_TEMP/private-refresh-manifest.json" && python tests/test_publication_guard.py PublicationGuard.test_publish_fresh_data_and_never_publish_development_files) > "$RUNNER_TEMP/private-publication-test.log" 2>&1; then
            echo 'Verified publishing fresh data without development files.'
          else
            echo 'Private publication verification failed; no data published.'
            exit 1
          fi
      - name: Check that no development files entered the output
        shell: bash
        run: |
          set -euo pipefail
          for path in sync.py scripts/rolling_learning.py scripts/weighted_rounds.py automation/original-workflows/fast-live-sync.yml .git/config index.html.map index.html.bak; do
            test ! -e "$RUNNER_TEMP/private-refresh-public-dist/$path"
          done
          test -s "$RUNNER_TEMP/private-refresh-public-dist/data/position-matchups.json"
          echo 'No development files in verified output; no artifacts uploaded.'
