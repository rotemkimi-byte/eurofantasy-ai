name: Daily EuroFantasy backup artifact

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-project-backup.yml'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build dated project ZIP
        id: package
        shell: bash
        run: |
          day=$(TZ=Asia/Jerusalem date +%Y-%m-%d)
          archive="eurofantasy-ai_${day}.zip"
          git archive --format=zip --output="${archive}" HEAD
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "day=${day}" >> "$GITHUB_OUTPUT"
          test -s "${archive}"

      - name: Store downloadable backup
        uses: actions/upload-artifact@v4
        with:
          name: eurofantasy-ai-${{ steps.package.outputs.day }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
