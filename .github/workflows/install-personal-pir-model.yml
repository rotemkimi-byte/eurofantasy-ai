name: Install Personal PIR Model
"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-personal-pir-model.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: personal-player-model
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the checked model and official 2025-26 history
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, json
          from pathlib import Path
          source = Path('.github/workflows/install-personal-pir-model.yml').read_text()
          block = source.split('\n# MODEL_PAYLOAD_BEGIN\n', 1)[1].split('\n# MODEL_PAYLOAD_END', 1)[0]
          payload = ''.join(line.removeprefix('# ') for line in block.splitlines())
          manifest = json.loads(gzip.decompress(base64.b64decode(payload)))
          assert manifest['schema'] == 'personal-pir-install-v1'
          prepared = []
          for entry in manifest['files']:
              path = Path(entry['path'])
              if path.is_absolute() or '..' in path.parts:
                  raise RuntimeError('Invalid install path')
              content = base64.b64decode(entry['content'])
              digest = hashlib.sha256(content).hexdigest()
              if digest != entry['target']:
                  raise RuntimeError('Damaged payload: ' + str(path))
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if current not in (entry['base'], entry['target']):
                  raise RuntimeError('File changed since this update was prepared; preserved: ' + str(path))
              prepared.append((path, content))
          for path, content in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          print('Installed', len(prepared), 'verified model files')
          PYCODE
      - name: Regression checks and chronological validation
        run: |
          node scripts/test_personal_model.cjs
          node scripts/validate_personal_model.cjs
          python - <<'PYCODE'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from fantasy_learning import model_id
          Path('learning-model-version.js').write_text('window.__learningModelId=' + json.dumps(model_id()) + ';\n')
          PYCODE
          python scripts/fantasy_learning.py grade
      - name: Install browser for integration verification
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify site and freeze upcoming forecasts
        run: |
          python scripts/check_personal_site.py
          python scripts/snapshot_live_model.py
      - name: Save the verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/backtest.yml .github/workflows/install-fantasy-learning.yml index.html learning.js model-stability.js position-matchups.js scripts/fantasy_learning.py scripts/snapshot_live_model.py .github/workflows/personal-model.yml personal-model-core.js personal-model.js scripts/build_player_history.py scripts/check_personal_site.py scripts/forecast_players.cjs scripts/test_personal_model.cjs scripts/validate_personal_model.cjs data/player-history.json data/player-history-games.json.gz data/personal-model-validation.json learning-model-version.js data/learning
          if ! git diff --cached --quiet; then
            git commit -m 'Improve PIR model with personal history and validated momentum'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: install
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the model update
        id: deployment
        uses: actions/deploy-pages@v4

