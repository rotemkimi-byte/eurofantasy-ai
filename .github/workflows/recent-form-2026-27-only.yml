name: EuroFantasy Recent Form 2026-27 Only

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: recent-form-2026-27-only
  cancel-in-progress: true

jobs:
  recent-form:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current-season-only recent form
        run: |
          python - <<'PY'
          import json
          import re
          import statistics
          import time
          import unicodedata
          import urllib.error
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          DATA = Path("data")
          DATA.mkdir(exist_ok=True)

          SEASON = "E2026"
          CACHE_PATH = DATA / "euroleague-live-E2026.json"

          GAMES_URL = (
              "https://api-live.euroleague.net/"
              "v2/competitions/E/seasons/"
              f"{SEASON}/games?limit=500"
          )

          STATS_URL = (
              "https://api-live.euroleague.net/"
              "v2/competitions/E/seasons/"
              f"{SEASON}/games/{{game_code}}/stats"
          )

          MIRROR_STATS_URL = (
              "https://feeds.incrowdsports.com/"
              "provider/euroleague-feeds/v2/"
              "competitions/E/seasons/"
              f"{SEASON}/games/{{game_code}}/stats"
          )

          def norm(value):
              text = unicodedata.normalize(
                  "NFKD",
                  str(value or "")
              )
              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text.lower()
              ).strip()

          def fantasy_key(name):
              raw = str(name or "").strip()

              if "," in raw:
                  last, first = raw.split(",", 1)
                  raw = f"{first.strip()} {last.strip()}"

              return norm(raw)

          def load_json(path, default):
              path = Path(path)

              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception:
                  return default

          def save_json(path, value):
              Path(path).write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          def fetch_json(url, attempts=4):
              last_error = None

              for attempt in range(attempts):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent":
                              "EuroFantasy-AI/1.0",
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:
                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except urllib.error.HTTPError as exc:
                      last_error = exc

                      if exc.code == 429:
                          retry_after = (
                              exc.headers.get("Retry-After")
                          )

                          try:
                              wait = float(retry_after)
                          except (TypeError, ValueError):
                              wait = min(
                                  60,
                                  12 * (attempt + 1)
                              )

                          print(
                              "429 rate limit; sleeping",
                              wait,
                              "seconds"
                          )
                          time.sleep(wait)
                          continue

                      if exc.code in (404, 405):
                          raise

                      time.sleep(4 * (attempt + 1))

                  except Exception as exc:
                      last_error = exc
                      time.sleep(4 * (attempt + 1))

              raise RuntimeError(
                  f"Request failed: {url}: {last_error}"
              )

          def fetch_stats(game_code):
              try:
                  return fetch_json(
                      STATS_URL.format(
                          game_code=game_code
                      )
                  )
              except Exception as primary_error:
                  print(
                      "Primary stats warning:",
                      game_code,
                      primary_error
                  )

              return fetch_json(
                  MIRROR_STATS_URL.format(
                      game_code=game_code
                  )
              )

          def game_code(game):
              for key in (
                  "gameCode",
                  "gamecode",
                  "code",
              ):
                  value = game.get(key)

                  if value is None:
                      continue

                  try:
                      return int(value)
                  except (TypeError, ValueError):
                      pass

              return None

          def game_date(game):
              for key in (
                  "date",
                  "utcDate",
                  "localDate",
                  "startDate",
                  "startDateTime",
              ):
                  value = game.get(key)

                  if value:
                      return str(value)

              return None

          def is_played(game):
              value = game.get("played")

              if isinstance(value, bool):
                  return value

              if isinstance(value, (int, float)):
                  return bool(value)

              return str(value or "").lower() in (
                  "1",
                  "true",
                  "yes",
              )

          def player_name(entry):
              player = (
                  entry.get("player")
                  if isinstance(entry, dict)
                  else {}
              ) or {}

              person = (
                  player.get("person")
                  if isinstance(player, dict)
                  else {}
              ) or {}

              def from_obj(obj):
                  if isinstance(obj, str):
                      return obj.strip()

                  if not isinstance(obj, dict):
                      return ""

                  for key in (
                      "name",
                      "fullName",
                      "playerName",
                      "displayName",
                      "alias",
                  ):
                      value = obj.get(key)

                      if value:
                          return str(value).strip()

                  first = (
                      obj.get("firstName")
                      or obj.get("first_name")
                      or obj.get("first")
                      or ""
                  )
                  last = (
                      obj.get("lastName")
                      or obj.get("last_name")
                      or obj.get("last")
                      or obj.get("surname")
                      or ""
                  )

                  return f"{first} {last}".strip()

              return (
                  from_obj(person)
                  or from_obj(player)
                  or from_obj(entry)
              )

          def extract_game_rows(
              payload,
              code,
              date_string
          ):
              rows = []

              if not isinstance(payload, dict):
                  return rows

              for side_name in ("local", "road"):
                  side = payload.get(side_name) or {}

                  entries = (
                      side.get("players")
                      if isinstance(side, dict)
                      else []
                  )

                  if not isinstance(entries, list):
                      continue

                  for entry in entries:
                      if not isinstance(entry, dict):
                          continue

                      stats = entry.get("stats") or {}

                      if not isinstance(stats, dict):
                          continue

                      name = player_name(entry)

                      try:
                          seconds = float(
                              stats.get("timePlayed")
                              or 0
                          )
                          pir = float(
                              stats.get("valuation")
                          )
                      except (TypeError, ValueError):
                          continue

                      # Same minimum as before:
                      # ignore appearances under 5 minutes.
                      if not name or seconds < 300:
                          continue

                      minutes = seconds / 60.0

                      rows.append({
                          "season": SEASON,
                          "gameCode": int(code),
                          "date": date_string,
                          "name": name,
                          "minutes": minutes,
                          "pir": pir,
                          "rate": pir / minutes,
                      })

              return rows

          games_payload = fetch_json(GAMES_URL)

          games = (
              games_payload.get("data", [])
              if isinstance(games_payload, dict)
              else []
          )

          played_games = [
              game
              for game in games
              if is_played(game)
          ]

          cache = load_json(
              CACHE_PATH,
              {
                  "season": SEASON,
                  "games": {},
              }
          )

          # If the cache came from another season,
          # reset it completely.
          if cache.get("season") != SEASON:
              cache = {
                  "season": SEASON,
                  "games": {},
              }

          if not isinstance(cache.get("games"), dict):
              cache["games"] = {}

          new_games = 0

          for game in played_games:
              code = game_code(game)

              if code is None:
                  continue

              key = str(code)

              if key in cache["games"]:
                  continue

              date_string = game_date(game)

              try:
                  payload = fetch_stats(code)

                  rows = extract_game_rows(
                      payload,
                      code,
                      date_string
                  )

                  if not rows:
                      print(
                          "No usable player stats yet for",
                          code,
                          "- will retry"
                      )
                      continue

                  cache["games"][key] = {
                      "gameCode": code,
                      "date": date_string,
                      "rows": rows,
                      "cached_at":
                          datetime.now(
                              timezone.utc
                          ).isoformat(),
                  }

                  new_games += 1

                  print(
                      "Cached E2026 game",
                      code,
                      "players:",
                      len(rows)
                  )

                  time.sleep(7)

              except Exception as exc:
                  print(
                      "Stats warning:",
                      code,
                      exc
                  )

          cache["season"] = SEASON
          cache["updated_at"] = (
              datetime.now(timezone.utc).isoformat()
          )
          cache["playedGamesSeen"] = len(played_games)

          save_json(CACHE_PATH, cache)

          grouped = defaultdict(list)

          for item in cache["games"].values():
              for row in item.get("rows") or []:
                  if row.get("season") != SEASON:
                      continue

                  key = fantasy_key(
                      row.get("name")
                  )

                  if key:
                      grouped[key].append(row)

          def avg(sample, field):
              if not sample:
                  return None

              return sum(
                  float(g[field])
                  for g in sample
              ) / len(sample)

          def total_rate(sample):
              if not sample:
                  return None

              minutes = sum(
                  float(g["minutes"])
                  for g in sample
              )

              if minutes <= 0:
                  return None

              return (
                  sum(
                      float(g["pir"])
                      for g in sample
                  )
                  / minutes
              )

          output = {}

          for key, player_games in grouped.items():
              player_games.sort(
                  key=lambda g: (
                      str(g.get("date") or ""),
                      int(g.get("gameCode") or 0),
                  )
              )

              latest = player_games[-1]
              previous4 = player_games[-5:-1]
              last5 = player_games[-5:]
              last10 = player_games[-10:]

              pir_values = [
                  float(g["pir"])
                  for g in last5
              ]

              sd = (
                  statistics.pstdev(pir_values)
                  if len(pir_values) >= 2
                  else 0.0
              )

              display_name = latest["name"]

              if "," in display_name:
                  last, first = display_name.split(",", 1)
                  display_name = (
                      f"{first.strip()} "
                      f"{last.strip()}"
                  )

              output[key] = {
                  "name": display_name,
                  "latestSeason": SEASON,
                  "gamesAvailable":
                      len(player_games),
                  "gamesLatestSeason":
                      len(player_games),
                  "currentSeasonGames":
                      len(player_games),
                  "lastGame": {
                      "season": SEASON,
                      "gameCode":
                          latest["gameCode"],
                      "date":
                          latest["date"],
                      "pir":
                          round(
                              latest["pir"],
                              2
                          ),
                      "minutes":
                          round(
                              latest["minutes"],
                              2
                          ),
                      "pirPerMinute":
                          round(
                              latest["rate"],
                              5
                          ),
                  },
                  "previous4": {
                      "games":
                          len(previous4),
                      "avgPir": (
                          round(
                              avg(
                                  previous4,
                                  "pir"
                              ),
                              2
                          )
                          if previous4
                          else None
                      ),
                      "avgMinutes": (
                          round(
                              avg(
                                  previous4,
                                  "minutes"
                              ),
                              2
                          )
                          if previous4
                          else None
                      ),
                      "pirPerMinute": (
                          round(
                              total_rate(
                                  previous4
                              ),
                              5
                          )
                          if previous4
                          else None
                      ),
                  },
                  "last5": {
                      "games": len(last5),
                      "avgPir":
                          round(
                              avg(last5, "pir"),
                              2
                          ),
                      "avgMinutes":
                          round(
                              avg(
                                  last5,
                                  "minutes"
                              ),
                              2
                          ),
                      "sdPir":
                          round(sd, 2),
                  },
                  "last10": {
                      "games": len(last10),
                      "avgPir":
                          round(
                              avg(last10, "pir"),
                              2
                          ),
                      "avgMinutes":
                          round(
                              avg(
                                  last10,
                                  "minutes"
                              ),
                              2
                          ),
                  },
                  "season": {
                      "games":
                          len(player_games),
                      "avgPir":
                          round(
                              avg(
                                  player_games,
                                  "pir"
                              ),
                              2
                          ),
                      "avgMinutes":
                          round(
                              avg(
                                  player_games,
                                  "minutes"
                              ),
                              2
                          ),
                      "pirPerMinute":
                          round(
                              total_rate(
                                  player_games
                              ),
                              5
                          ),
                  },
              }

          result = {
              "players": output,
              "playerCount": len(output),
              "source":
                  "Official EuroLeague E2026 only",
              "currentSeason": SEASON,
              "currentSeasonPlayedGames":
                  len(played_games),
              "currentSeasonCachedGames":
                  len(cache["games"]),
              "newGamesThisRun":
                  new_games,
              "method":
                  (
                      "2026/27 season only. "
                      "No E2025 games are used in "
                      "last/5/10/season form."
                  ),
              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),
          }

          save_json(
              DATA / "recent-form.json",
              result
          )

          print(
              "E2026-only recent form:",
              len(output),
              "players | games:",
              len(cache["games"])
          )
          PY

      - name: Install current-season-only projection layer
        run: |
          cat > recent-form.js <<'EOF'
          (async () => {
            try {
              const response = await fetch(
                "./data/recent-form.json?t="
                  + Date.now(),
                { cache: "no-store" }
              );

              if (!response.ok) {
                throw new Error(
                  "recent-form.json HTTP "
                  + response.status
                );
              }

              const payload =
                await response.json();

              const form =
                payload.players || {};

              const sleep = ms =>
                new Promise(resolve =>
                  setTimeout(resolve, ms)
                );

              for (
                let i = 0;
                i < 50
                && !window.__positionMatchupsPatched;
                i++
              ) {
                await sleep(100);
              }

              if (
                typeof model !== "function"
                || typeof renderAll
                  !== "function"
              ) {
                throw new Error(
                  "EuroFantasy model not ready"
                );
              }

              if (window.__recentFormPatched) {
                return;
              }

              window.__recentFormPatched = true;
              window.__recentFormData = payload;

              const originalModel = model;

              const norm = value =>
                String(value || "")
                  .normalize("NFD")
                  .replace(
                    /[\u0300-\u036f]/g,
                    ""
                  )
                  .toLowerCase()
                  .replace(
                    /[^a-z0-9 ]/g,
                    " "
                  )
                  .replace(
                    /\s+/g,
                    " "
                  )
                  .trim();

              const clampValue = (
                x,
                min,
                max
              ) =>
                Math.max(
                  min,
                  Math.min(max, x)
                );

              const valid = value => {
                const n = Number(value);

                return (
                  Number.isFinite(n)
                  ? n
                  : null
                );
              };

              function pricePriorMinutes(
                price
              ) {
                const p =
                  Number(price || 0);

                if (p >= 14) return 27;
                if (p >= 10) return 23;
                if (p >= 7) return 19;
                return 14;
              }

              function currentRate(recent) {
                const last =
                  valid(
                    recent.lastGame
                      ?.pirPerMinute
                  );

                const prev =
                  valid(
                    recent.previous4
                      ?.pirPerMinute
                  );

                const season =
                  valid(
                    recent.season
                      ?.pirPerMinute
                  );

                const parts = [];

                if (last !== null) {
                  parts.push([0.45, last]);
                }

                if (prev !== null) {
                  parts.push([0.35, prev]);
                }

                if (season !== null) {
                  parts.push([0.20, season]);
                }

                const total =
                  parts.reduce(
                    (sum, [w]) =>
                      sum + w,
                    0
                  );

                if (!total) return null;

                return (
                  parts.reduce(
                    (sum, [w, v]) =>
                      sum + w * v,
                    0
                  ) / total
                );
              }

              function currentMinutes(
                recent
              ) {
                const last =
                  valid(
                    recent.lastGame
                      ?.minutes
                  );

                const prev =
                  valid(
                    recent.previous4
                      ?.avgMinutes
                  );

                const season =
                  valid(
                    recent.season
                      ?.avgMinutes
                  );

                const parts = [];

                if (last !== null) {
                  parts.push([0.45, last]);
                }

                if (prev !== null) {
                  parts.push([0.30, prev]);
                }

                if (season !== null) {
                  parts.push([0.25, season]);
                }

                const total =
                  parts.reduce(
                    (sum, [w]) =>
                      sum + w,
                    0
                  );

                if (!total) return null;

                return (
                  parts.reduce(
                    (sum, [w, v]) =>
                      sum + w * v,
                    0
                  ) / total
                );
              }

              function freshSeasonPrior(
                p,
                x
              ) {
                const price =
                  Number(p.price || 0);

                const basePir =
                  price * 0.93;

                const baseMin =
                  pricePriorMinutes(
                    price
                  );

                let minutes =
                  baseMin
                  + Number(
                      x.injuryBoost || 0
                    );

                if (
                  p.status
                  === "questionable"
                ) {
                  minutes *= 0.82;
                }

                if (
                  p.status === "out"
                ) {
                  minutes = 0;
                }

                const margin =
                  Number(
                    x.match?.margin || 0
                  );

                if (
                  margin >= 10
                  && price >= 12
                ) {
                  minutes *= 0.97;
                }

                if (
                  margin >= 10
                  && price <= 7
                ) {
                  minutes *= 1.05;
                }

                minutes =
                  clampValue(
                    minutes,
                    0,
                    36
                  );

                const teamPct =
                  Number(
                    x.teamMatchPct
                    ?? x.matchPct
                    ?? 0
                  );

                const positionPct =
                  Number(
                    x.positionMatchPct
                    ?? 0
                  );

                const teamFactor =
                  1
                  + (
                      clampValue(
                        teamPct,
                        -8,
                        8
                      ) / 100
                    ) * 0.60;

                const positionFactor =
                  1
                  + (
                      clampValue(
                        positionPct,
                        -12,
                        12
                      ) / 100
                    ) * 0.35;

                const expected =
                  p.status === "out"
                    ? 0
                    : Math.max(
                        0,
                        basePir
                        * (
                            minutes
                            / Math.max(
                                baseMin,
                                1
                              )
                          )
                        * teamFactor
                        * positionFactor
                      );

                return {
                  expected,
                  minutes,
                  basePir,
                  baseMin,
                  teamFactor,
                  positionFactor,
                };
              }

              model = function (p) {
                const x =
                  originalModel(p);

                const prior =
                  freshSeasonPrior(
                    p,
                    x
                  );

                const recent =
                  form[norm(p.name)];

                const games =
                  Number(
                    recent
                      ?.currentSeasonGames
                    || 0
                  );

                // No 2026/27 game yet:
                // use price + current context only.
                if (
                  !recent
                  || games <= 0
                ) {
                  x.expected =
                    prior.expected;
                  x.minutes =
                    prior.minutes;
                  x.basePir =
                    prior.basePir;
                  x.baseMin =
                    prior.baseMin;
                  x.source =
                    "2026/27 price prior";
                  x.recentForm = null;
                  x.recentDynamic = null;
                  x.livePrice =
                    Number(p.price);

                  const conf =
                    p.status === "out"
                      ? 95
                      : p.status
                        === "questionable"
                        ? 30
                        : 40;

                  x.confidence = conf;

                  const u =
                    1 - conf / 100;

                  x.floor =
                    x.expected
                    * (
                        0.76
                        - 0.18 * u
                      );

                  x.ceiling =
                    x.expected
                    * (
                        1.28
                        + 0.30 * u
                      );

                  x.value =
                    x.expected
                    / Math.max(
                        0.1,
                        Number(p.price)
                      );

                  return x;
                }

                if (
                  p.status === "out"
                ) {
                  x.expected = 0;
                  x.minutes = 0;
                  x.floor = 0;
                  x.ceiling = 0;
                  x.value = 0;
                  x.confidence = 95;
                  x.source =
                    "2026/27 current season";
                  x.recentForm = recent;
                  x.livePrice =
                    Number(p.price);
                  return x;
                }

                const rate =
                  currentRate(recent);

                const observedMinutes =
                  currentMinutes(recent);

                if (
                  rate === null
                  || observedMinutes === null
                ) {
                  x.expected =
                    prior.expected;
                  x.minutes =
                    prior.minutes;
                  x.source =
                    "2026/27 price prior";
                  x.recentForm =
                    recent;
                  return x;
                }

                const sampleWeight =
                  clampValue(
                    0.28
                    + 0.12 * games,
                    0.40,
                    0.85
                  );

                let minutes =
                  prior.minutes
                  * (1 - sampleWeight)
                  + observedMinutes
                    * sampleWeight;

                minutes =
                  clampValue(
                    minutes,
                    5,
                    36
                  );

                const currentExpected =
                  rate
                  * minutes
                  * prior.teamFactor
                  * prior.positionFactor;

                const expected =
                  prior.expected
                  * (1 - sampleWeight)
                  + currentExpected
                    * sampleWeight;

                const confidence =
                  clampValue(
                    40 + games * 8,
                    40,
                    84
                  )
                  - (
                      p.status
                      === "questionable"
                        ? 18
                        : 0
                    );

                const conf =
                  clampValue(
                    confidence,
                    25,
                    94
                  );

                const u =
                  1 - conf / 100;

                x.expected =
                  Math.max(
                    0,
                    expected
                  );
                x.minutes = minutes;
                x.confidence = conf;
                x.floor =
                  x.expected
                  * (
                      0.76
                      - 0.18 * u
                    );
                x.ceiling =
                  x.expected
                  * (
                      1.28
                      + 0.30 * u
                    );
                x.value =
                  x.expected
                  / Math.max(
                      0.1,
                      Number(p.price)
                    );

                x.source =
                  "2026/27 current season";
                x.recentForm = recent;
                x.recentRate = rate;
                x.recentMinutes =
                  observedMinutes;
                x.livePrice =
                  Number(p.price);
                x.currentSeasonGames =
                  games;
                x.currentSeasonWeight =
                  sampleWeight;

                return x;
              };

              renderAll();

              console.log(
                "2026/27-only recent form active:",
                Object.keys(form).length,
                "players"
              );

            } catch (error) {
              console.error(
                "2026/27 recent-form error:",
                error
              );
            }
          })();
          EOF

      - name: Save
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/recent-form.json \
            data/euroleague-live-E2026.json \
            recent-form.js

          if git diff --cached --quiet; then
            echo "No current-season changes"
          else
            git commit -m \
              "Reset recent form to 2026-27 season"
            git pull --rebase origin main
            git push
          fi
