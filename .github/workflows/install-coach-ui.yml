name: Install clear coach cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-coach-ui.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-coach-ui
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install coach presentation
        run: |
          python - <<'PYINSTALL'
          import base64,zlib
          source=zlib.decompress(base64.b64decode('')).decode('utf-8')
          exec(compile(source,'install_coaches.py','exec'),{'__name__':'__main__'})
          PYINSTALL
      - name: Check coach sorting and observed results
        run: |
          node --check coaches-ui.js
          node tests/test_coaches_ui.cjs
      - name: Save coach presentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html coaches-ui.js coaches-ui.css tests/test_coaches_ui.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Show coaches by price with venue form and clear win probabilities'
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
            done
            if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish coach cards
        id: deployment
        uses: actions/deploy-pages@v4
