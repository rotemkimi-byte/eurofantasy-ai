name: Sync current round price changes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-round-prices.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-round-prices
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore current-round price comparison and automatic refresh
        run: |
          python - <<'PYINSTALL'
          import base64,zlib
          source=zlib.decompress(base64.b64decode('')).decode('utf-8')
          exec(compile(source,'install_round_prices.py','exec'),{'__name__':'__main__'})
          PYINSTALL
      - name: Check price publication and round rollover
        run: |
          node --check round-review.js
          node tests/test_round_review.cjs
      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html round-review.js tests/test_round_review.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Keep current round price changes at zero until repricing and refresh automatically'
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
            done
            if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
