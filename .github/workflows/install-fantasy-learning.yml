name: EuroFantasy Learning
on:
  workflow_dispatch:
  schedule:
    - cron: "43 */2 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install learning files once
        run: |
          python - <<'BOOTSTRAP'
          import base64
          from pathlib import Path
          files={'scripts/fantasy_learning.py': '', 'scripts/snapshot_live_model.py': '', 'scripts/install_learning.py': '', 'learning.js': '', 'learning.css': ''}
          for name, encoded in files.items():
              p=Path(name)
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(base64.b64decode(encoded))
          BOOTSTRAP
          python scripts/install_learning.py
      - name: Install browser for the actual site model
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Grade prior forecasts and freeze the next games
        run: |
          python scripts/fantasy_learning.py prepare
          python scripts/fantasy_learning.py grade
          python scripts/snapshot_live_model.py
      - name: Save reports, model integration and frozen forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html learning.js learning.css learning-model-version.js scripts/install_learning.py scripts/fantasy_learning.py scripts/snapshot_live_model.py data/learning data/backtest/cache
          if ! git diff --cached --quiet; then
          git commit -m "Audit forecasts and update validated learning calibration"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
          done
          if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the updated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: learn
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the updated site
        id: deployment
        uses: actions/deploy-pages@v4
