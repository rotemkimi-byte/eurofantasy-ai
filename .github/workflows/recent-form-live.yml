name: EuroFantasy Recent Form

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"

permissions:
  contents: write

concurrency:
  group: recent-form
  cancel-in-progress: true

jobs:
  recent-form:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb

      - name: Download EuroLeague data snapshot
        run: |
          curl -L --fail --retry 3 --retry-delay 3 \
            -o /tmp/euroleague.duckdb \
            https://raw.githubusercontent.com/McNews11/euroleague-open-data/main/data/euroleague.duckdb

      - name: Build recent form data
        run: |
          python - <<'PY'
          import json
          import math
          import re
          import statistics
          import unicodedata
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb

          DATA = Path("data")
          DATA.mkdir(exist_ok=True)

          def norm(value):
              text = unicodedata.normalize(
                  "NFKD",
                  str(value or "")
              )
              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text.lower()
              ).strip()

          con = duckdb.connect(
              "/tmp/euroleague.duckdb",
              read_only=True
          )

          rows = con.execute(
              """
              SELECT
                  b.season_code,
                  b.game_code,
                  g.utc_date,
                  p.name AS player_name,
                  b.seconds_played,
                  b.valuation
              FROM boxscores_player b
              JOIN games g
                ON g.season_code = b.season_code
               AND g.game_code = b.game_code
              LEFT JOIN players p
                ON p.person_code = b.person_code
              WHERE b.season_code IN ('E2025', 'E2026')
                AND g.played
                AND p.name IS NOT NULL
                AND b.seconds_played >= 300
                AND b.valuation IS NOT NULL
              ORDER BY p.name, g.utc_date, b.game_code
              """
          ).fetchall()

          con.close()

          by_player = defaultdict(list)

          for (
              season,
              game_code,
              utc_date,
              player_name,
              seconds,
              valuation
          ) in rows:
              try:
                  minutes = float(seconds) / 60.0
                  pir = float(valuation)
              except (TypeError, ValueError):
                  continue

              if minutes < 5:
                  continue

              by_player[norm(player_name)].append({
                  "season": str(season),
                  "gameCode": int(game_code),
                  "date": str(utc_date),
                  "name": str(player_name),
                  "minutes": minutes,
                  "pir": pir,
                  "rate": pir / minutes if minutes > 0 else 0.0,
              })

          output = {}

          for key, games in by_player.items():
              if not games:
                  continue

              games.sort(
                  key=lambda g: (
                      g["date"],
                      g["gameCode"]
                  )
              )

              latest = games[-1]
              previous4 = games[-5:-1]
              last5 = games[-5:]
              last10 = games[-10:]

              latest_season = latest["season"]
              season_games = [
                  g for g in games
                  if g["season"] == latest_season
              ]

              # If the new season has only just begun, keep the
              # long-term baseline stable by falling back to the
              # full available sample.
              baseline_games = (
                  season_games
                  if len(season_games) >= 3
                  else games
              )

              def total_rate(sample):
                  mins = sum(g["minutes"] for g in sample)
                  if mins <= 0:
                      return None
                  return sum(g["pir"] for g in sample) / mins

              def avg(sample, field):
                  if not sample:
                      return None
                  return sum(g[field] for g in sample) / len(sample)

              last_rate = latest["rate"]
              prev4_rate = total_rate(previous4)
              season_rate = total_rate(baseline_games)

              pieces = []
              if last_rate is not None:
                  # Last game has the biggest single weight.
                  # If the player barely played, reduce that weight.
                  last_reliability = min(
                      1.0,
                      latest["minutes"] / 20.0
                  )
                  pieces.append((
                      0.40 * last_reliability,
                      last_rate
                  ))

              if prev4_rate is not None:
                  pieces.append((0.35, prev4_rate))

              if season_rate is not None:
                  pieces.append((0.25, season_rate))

              total_weight = sum(w for w, _ in pieces)

              if total_weight <= 0:
                  continue

              raw_rate = sum(
                  w * rate for w, rate in pieces
              ) / total_weight

              # One wild game should move the forecast, not own it.
              if season_rate is not None and season_rate > 0:
                  form_rate = max(
                      season_rate * 0.65,
                      min(
                          season_rate * 1.35,
                          raw_rate
                      )
                  )
              else:
                  form_rate = raw_rate

              prev4_minutes = avg(
                  previous4,
                  "minutes"
              )
              baseline_minutes = avg(
                  baseline_games,
                  "minutes"
              )

              minute_parts = [
                  (0.45, latest["minutes"]),
              ]

              if prev4_minutes is not None:
                  minute_parts.append(
                      (0.35, prev4_minutes)
                  )

              if baseline_minutes is not None:
                  minute_parts.append(
                      (0.20, baseline_minutes)
                  )

              minute_weight = sum(
                  w for w, _ in minute_parts
              )

              recent_minutes = sum(
                  w * m for w, m in minute_parts
              ) / minute_weight

              pir_values = [
                  g["pir"]
                  for g in last5
              ]

              form_sd = (
                  statistics.pstdev(pir_values)
                  if len(pir_values) >= 2
                  else 0.0
              )

              output[key] = {
                  "name": latest["name"],
                  "latestSeason": latest_season,
                  "gamesAvailable": len(games),
                  "gamesLatestSeason": len(season_games),
                  "lastGame": {
                      "date": latest["date"],
                      "pir": round(
                          latest["pir"],
                          2
                      ),
                      "minutes": round(
                          latest["minutes"],
                          2
                      ),
                      "pirPerMinute": round(
                          latest["rate"],
                          5
                      ),
                  },
                  "previous4": {
                      "games": len(previous4),
                      "avgPir": (
                          round(
                              avg(previous4, "pir"),
                              2
                          )
                          if previous4
                          else None
                      ),
                      "avgMinutes": (
                          round(
                              prev4_minutes,
                              2
                          )
                          if prev4_minutes
                          is not None
                          else None
                      ),
                      "pirPerMinute": (
                          round(
                              prev4_rate,
                              5
                          )
                          if prev4_rate
                          is not None
                          else None
                      ),
                  },
                  "last5": {
                      "games": len(last5),
                      "avgPir": round(
                          avg(last5, "pir"),
                          2
                      ),
                      "avgMinutes": round(
                          avg(last5, "minutes"),
                          2
                      ),
                      "sdPir": round(
                          form_sd,
                          2
                      ),
                  },
                  "last10": {
                      "games": len(last10),
                      "avgPir": round(
                          avg(last10, "pir"),
                          2
                      ),
                      "avgMinutes": round(
                          avg(last10, "minutes"),
                          2
                      ),
                  },
                  "baseline": {
                      "games": len(
                          baseline_games
                      ),
                      "avgPir": round(
                          avg(
                              baseline_games,
                              "pir"
                          ),
                          2
                      ),
                      "avgMinutes": round(
                          baseline_minutes,
                          2
                      ),
                      "pirPerMinute": round(
                          season_rate,
                          5
                      ),
                  },
                  "model": {
                      "formPirPerMinute": round(
                          form_rate,
                          5
                      ),
                      "recentMinutes": round(
                          recent_minutes,
                          2
                      ),
                      "weights": {
                          "lastGame": 0.40,
                          "previous4": 0.35,
                          "baseline": 0.25,
                      },
                  },
              }

          if len(output) < 100:
              raise RuntimeError(
                  f"Recent-form extraction too small: "
                  f"{len(output)} players"
              )

          result = {
              "players": output,
              "playerCount": len(output),
              "source": (
                  "EuroLeague official boxscores via "
                  "euroleague-open-data snapshot"
              ),
              "method": (
                  "PIR/min blend: last game 40%, "
                  "previous four 35%, baseline 25%; "
                  "last-game weight reduced for low minutes"
              ),
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
          }

          (DATA / "recent-form.json").write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "Recent form created for",
              len(output),
              "players"
          )
          PY

      - name: Create recent-form model layer
        run: |
          cat > recent-form.js <<'EOF'
          (async () => {
            try {
              const response = await fetch(
                "./data/recent-form.json?t="
                + Date.now(),
                { cache: "no-store" }
              );

              if (!response.ok) {
                throw new Error(
                  "recent-form.json HTTP "
                  + response.status
                );
              }

              const payload =
                await response.json();

              const form =
                payload.players || {};

              const sleep = ms =>
                new Promise(resolve =>
                  setTimeout(resolve, ms)
                );

              // Position matchup is another model layer.
              // Give it a moment to install first so this layer
              // can use both team and positional matchup fields.
              for (
                let i = 0;
                i < 50
                && !window.__positionMatchupsPatched;
                i++
              ) {
                await sleep(100);
              }

              if (
                typeof model !== "function"
                ||
                typeof renderAll !== "function"
              ) {
                throw new Error(
                  "EuroFantasy model is not ready"
                );
              }

              if (
                window.__recentFormPatched
              ) {
                return;
              }

              window.__recentFormPatched = true;
              window.__recentFormData = payload;

              const originalModel = model;

              const norm = value =>
                String(value || "")
                  .normalize("NFD")
                  .replace(
                    /[\u0300-\u036f]/g,
                    ""
                  )
                  .toLowerCase()
                  .replace(
                    /[^a-z0-9 ]/g,
                    " "
                  )
                  .replace(/\s+/g, " ")
                  .trim();

              const clampValue = (
                x,
                min,
                max
              ) => Math.max(
                min,
                Math.min(max, x)
              );

              model = function (p) {
                const x =
                  originalModel(p);

                const recent =
                  form[norm(p.name)];

                if (
                  !recent
                  || p.status === "out"
                ) {
                  x.recentForm =
                    recent || null;
                  return x;
                }

                const rate = Number(
                  recent
                    .model
                    ?.formPirPerMinute
                );

                const recentMinutes =
                  Number(
                    recent
                      .model
                      ?.recentMinutes
                  );

                if (
                  !Number.isFinite(rate)
                  || rate <= 0
                  || !Number.isFinite(
                    recentMinutes
                  )
                  || recentMinutes <= 0
                ) {
                  x.recentForm = recent;
                  return x;
                }

                // Existing x.minutes already contains injury,
                // availability and blowout logic. Blend it with
                // the recent rotation instead of replacing it.
                const modelBaseMinutes =
                  Number(
                    x.baseMin
                    || x.minutes
                    || recentMinutes
                  );

                const availabilityFactor =
                  modelBaseMinutes > 0
                    ? clampValue(
                        Number(x.minutes)
                        / modelBaseMinutes,
                        0,
                        1.25
                      )
                    : 1;

                let predictedMinutes =
                  (
                    recentMinutes * 0.70
                    + Number(x.minutes) * 0.30
                  )
                  * availabilityFactor;

                predictedMinutes =
                  clampValue(
                    predictedMinutes,
                    5,
                    36
                  );

                const teamPct =
                  Number(
                    x.teamMatchPct
                    ?? x.matchPct
                    ?? 0
                  );

                const positionPct =
                  Number(
                    x.positionMatchPct
                    ?? 0
                  );

                // Matchups matter, but are deliberately damped
                // so we don't double-count opponent effects.
                const teamFactor =
                  1
                  + clampValue(
                      teamPct,
                      -8,
                      8
                    )
                    / 100
                    * 0.60;

                const positionFactor =
                  1
                  + clampValue(
                      positionPct,
                      -12,
                      12
                    )
                    / 100
                    * 0.35;

                const oldExpected =
                  Math.max(
                    0.01,
                    Number(x.expected || 0.01)
                  );

                const newExpected =
                  Math.max(
                    0,
                    rate
                    * predictedMinutes
                    * teamFactor
                    * positionFactor
                  );

                const floorRatio =
                  Number(x.floor || 0)
                  / oldExpected;

                const ceilingRatio =
                  Number(x.ceiling || 0)
                  / oldExpected;

                x.expected = newExpected;
                x.minutes = predictedMinutes;

                x.floor = Math.max(
                  0,
                  newExpected
                  * clampValue(
                      floorRatio,
                      0.45,
                      0.90
                    )
                );

                x.ceiling =
                  newExpected
                  * clampValue(
                      ceilingRatio,
                      1.15,
                      1.75
                    );

                x.value =
                  newExpected
                  / Math.max(
                      0.1,
                      Number(p.price)
                    );

                x.source =
                  "Recent form blend";

                x.recentForm = recent;
                x.recentLastPir =
                  recent.lastGame?.pir;

                x.recentAvg5Pir =
                  recent.last5?.avgPir;

                x.recentAvg10Pir =
                  recent.last10?.avgPir;

                x.recentRate = rate;
                x.recentMinutes =
                  recentMinutes;

                x.teamMatchPctApplied =
                  (teamFactor - 1) * 100;

                x.positionMatchPctApplied =
                  (
                    positionFactor - 1
                  ) * 100;

                return x;
              };

              const addRecentToModal = () => {
                const body =
                  document.getElementById(
                    "modalBody"
                  );

                if (
                  !body
                  || body.querySelector(
                    ".recent-form-box"
                  )
                ) {
                  return;
                }

                if (
                  typeof players === "undefined"
                ) {
                  return;
                }

                const p =
                  players.find(
                    player =>
                      body.textContent.includes(
                        player.name
                      )
                  );

                if (!p) return;

                const x = model(p);
                const r = x.recentForm;

                if (!r) return;

                const box =
                  document.createElement(
                    "div"
                  );

                box.className =
                  "notice recent-form-box";

                box.style.marginTop =
                  "10px";

                const last =
                  Number(
                    r.lastGame?.pir
                  );

                const avg5 =
                  Number(
                    r.last5?.avgPir
                  );

                const avg10 =
                  Number(
                    r.last10?.avgPir
                  );

                box.textContent =
                  `כושר אחרון: ` +
                  `משחק אחרון ${last.toFixed(1)} PIR` +
                  ` • 5 אחרונים ${avg5.toFixed(1)}` +
                  ` • 10 אחרונים ${avg10.toFixed(1)}` +
                  ` • משקל המשחק האחרון 40%`;

                body.appendChild(box);
              };

              const modalBody =
                document.getElementById(
                  "modalBody"
                );

              if (modalBody) {
                new MutationObserver(() => {
                  requestAnimationFrame(
                    addRecentToModal
                  );
                }).observe(
                  modalBody,
                  {
                    childList: true
                  }
                );
              }

              renderAll();

              console.log(
                "Recent-form model active:",
                Object.keys(form).length,
                "players"
              );

            } catch (error) {
              console.error(
                "Recent-form model error:",
                error
              );
            }
          })();
          EOF

      - name: Connect recent-form layer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(
              encoding="utf-8"
          )

          tag = (
              '<script '
              'src="./recent-form.js">'
              '</script>'
          )

          if tag not in html:
              position_tag = (
                  '<script '
                  'src="./position-matchups.js">'
                  '</script>'
              )

              if position_tag in html:
                  html = html.replace(
                      position_tag,
                      position_tag + tag,
                      1
                  )
              else:
                  html = html.replace(
                      "</body>",
                      tag + "</body>",
                      1
                  )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

              print(
                  "Recent-form layer connected"
              )
          else:
              print(
                  "Recent-form layer already connected"
              )
          PY

      - name: Save
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/recent-form.json \
            recent-form.js \
            index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m \
              "Add recent form PIR model"
            git push
          fi
