name: Install Optimizer Fix
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eurofantasy-optimizer-fix
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install responsive roster optimizer
        run: |
          python - <<'BOOTSTRAP'
          import base64
          from pathlib import Path
          files={'optimizer-worker.js': '', 'optimizer.js': '', 'scripts/install_optimizer.py': ''}
          for name, encoded in files.items():
              p=Path(name)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))
          BOOTSTRAP
          python scripts/install_optimizer.py
      - name: Save optimizer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html optimizer.js optimizer-worker.js scripts/install_optimizer.py
          if ! git diff --cached --quiet; then
          git commit -m "Run roster optimizer in a worker and show progress"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
          done
          if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the updated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: learn
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the updated site
        id: deployment
        uses: actions/deploy-pages@v4
