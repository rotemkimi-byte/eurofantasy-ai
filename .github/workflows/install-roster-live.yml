name: Install Roster Live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create roster live loader
        run: |
          cat > roster-live.js <<'EOF'
          (async () => {
            try {
              const response = await fetch(
                "./data/roster.json?t=" + Date.now(),
                { cache: "no-store" }
              );

              if (!response.ok) {
                throw new Error("roster.json HTTP " + response.status);
              }

              const roster = await response.json();
              const names = Array.isArray(roster.players)
                ? roster.players
                : [];

              const applyRoster = () => {
                const available = new Set(
                  (Array.isArray(players) ? players : [])
                    .map(p => p.name)
                );

                const selected = names.filter(
                  name => available.has(name)
                );

                if (!selected.length) return;

                myTeam = selected;

                localStorage.setItem(
                  LS.team,
                  JSON.stringify(myTeam)
                );

                localStorage.setItem(
                  "efa2_roster_sync",
                  roster.updated_at ||
                  new Date().toISOString()
                );

                renderAll();
              };

              applyRoster();

              setTimeout(applyRoster, 800);
              setTimeout(applyRoster, 2000);

            } catch (error) {
              console.error(
                "Fantasy roster live error:",
                error
              );
            }
          })();
          EOF

      - name: Connect roster loader to site
        run: |
          grep -q 'src="./roster-live.js"' index.html || sed -i 's#</body></html>#<script src="./roster-live.js"></script></body></html>#' index.html

      - name: Save changes
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add roster-live.js index.html
          if git diff --cached --quiet; then
            echo "Already installed"
          else
            git commit -m "Load Fantasy roster automatically"
            git push
          fi
