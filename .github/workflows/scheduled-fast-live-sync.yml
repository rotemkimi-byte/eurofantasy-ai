name: EuroFantasy scheduled fast-live-sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/scheduled-fast-live-sync.yml']
  schedule:
    - cron: '2-59/5 * * * *'

permissions: {}

concurrency:
  group: eurofantasy-fantasy-data-sync
  cancel-in-progress: false

jobs:
  refresh:
    # Do not activate schedules on the staging repository or the old repository.
    if: github.repository_id == '1466932960' && github.repository == 'rotemkimi-byte/eurofantasy-ai' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/private-scheduled-task.yml
    with:
      task: 'fast-live-sync'
      timeout: 30
    secrets:
      DEV_REPOSITORY_TOKEN: ${{ secrets.DEV_REPOSITORY_TOKEN }}
      FANTASY_TOKEN: ${{ secrets.FANTASY_TOKEN }}
