name: Install Bargains and Super Squad
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-round-lab.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: install-round-lab
  cancel-in-progress: false
jobs:
  install:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install new tabs and automatic round analysis
        run: |
          python - <<'PYINSTALL'
          import base64,json,zlib
          from pathlib import Path
          files=json.loads(zlib.decompress(base64.b64decode('')))
          for name,content in files.items():
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content,encoding='utf-8')
          path=Path('index.html');html=path.read_text(encoding='utf-8')
          if './round-lab.css' not in html:
              assert '</head>' in html
              html=html.replace('</head>','<link rel="stylesheet" href="./round-lab.css?v=1"></head>',1)
          if './round-lab.js' not in html:
              assert '</body>' in html
              html=html.replace('</body>','<script src="./round-lab.js?v=1"></script></body>',1)
          path.write_text(html,encoding='utf-8')
          PYINSTALL
      - name: Install exact solver and verify features
        run: |
          python -m pip install 'scipy>=1.13,<2'
          node --check round-lab.js
          node tests/test_round_lab.cjs
          python -m unittest discover -s tests -p test_round_lab.py
          python scripts/round_lab.py
          git diff --check
      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html round-lab.js round-lab.css scripts/round_lab.py tests/test_round_lab.py tests/test_round_lab.cjs data/round-lab.json .github/workflows/round-lab-sync.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Add historical bargains and optimal actual-round fantasy squads'
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then pushed=yes; break; fi
            done
            if [ "${pushed:-no}" != yes ]; then exit 1; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: install
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
