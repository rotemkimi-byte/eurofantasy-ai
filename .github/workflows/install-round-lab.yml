name: Install Bargains and Super Squad
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-round-lab.yml'
      - 'scripts/round_lab.py'
      - 'round-lab.js'
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: install-round-lab
  cancel-in-progress: false
jobs:
  install:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact solver and verify features
        run: |
          python -m pip install 'scipy>=1.13,<2'
          node --check round-lab.js
          node tests/test_round_lab.cjs
          python -m unittest discover -s tests -p test_round_lab.py
      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/round_lab.py
            git diff --check
            git add data/round-lab.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh round bargains and actual-round fantasy squads'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: install
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
