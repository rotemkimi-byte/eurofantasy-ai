name: Verify remaining private data jobs (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-all-private-tasks.yml']

permissions: {}

jobs:
  verify:
    if: github.repository_id == '1466932960' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: [fantasy.sync, roster-sync, matchups-live, recent-form-2026-27-only, position-matchups-live, backtest, official-offense, install-fantasy-learning, install-matchup-context, install-rolling-learning, install-round-lab]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare workflow reader
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: actions/checkout@v4
        with:
          repository: rotemkimi-byte/eurofantasy-ai-dev-test
          ref: main
          path: private
          token: ${{ secrets.DEV_REPOSITORY_TOKEN }}
          fetch-depth: 0
      - name: Verify private scheduled task
        working-directory: private
        env:
          FANTASY_TOKEN: ${{ contains(fromJSON('["fantasy.sync","roster-sync"]'), matrix.task) && secrets.FANTASY_TOKEN || '' }}
          TASK: ${{ matrix.task }}
        run: python automation/run_legacy_task.py "$TASK"
      - name: Verify resulting publication without exposing files
        working-directory: private
        shell: bash
        run: |
          set -euo pipefail
          if (node scripts/audit_player_identities.cjs && python scripts/build_public_dist.py "$PWD" "$RUNNER_TEMP/task-test-dist" "$RUNNER_TEMP/task-test-manifest.json") > "$RUNNER_TEMP/private-test-output.log" 2>&1; then
            echo 'Runtime output validated; no private artifacts uploaded.'
          else
            echo 'Publication validation failed; production untouched.'
            exit 1
          fi
