name: Execute guarded private scheduled task

on:
  workflow_call:
    inputs:
      task:
        required: true
        type: string
      timeout:
        required: true
        type: number
    secrets:
      DEV_REPOSITORY_TOKEN:
        required: true
      FANTASY_TOKEN:
        required: false

permissions: {}

jobs:
  run:
    if: github.repository_id == '1466932960' && github.repository == 'rotemkimi-byte/eurofantasy-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare workflow reader
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: actions/checkout@v4
        with:
          repository: rotemkimi-byte/eurofantasy-ai-dev-test
          ref: main
          path: private
          token: ${{ secrets.DEV_REPOSITORY_TOKEN }}
          fetch-depth: 0
      - name: Run private data task
        working-directory: private
        env:
          TASK: ${{ inputs.task }}
          FANTASY_TOKEN: ${{ secrets.FANTASY_TOKEN }}
        run: python automation/run_legacy_task.py "$TASK"
