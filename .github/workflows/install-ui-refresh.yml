name: Install EuroFantasy UI Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create UI enhancements
        run: |
          cat > ui-live.js <<'EOF'
          (() => {
            const number1 = value => {
              const n = Number(value || 0);
              return `${n >= 0 ? "+" : ""}${n.toFixed(1)}%`;
            };

            function enhanceRows() {
              if (
                typeof players === "undefined" ||
                typeof model !== "function"
              ) {
                return;
              }

              document.querySelectorAll("#rows tr").forEach(tr => {
                const name = tr.querySelector("td.name b")
                  ?.textContent
                  ?.trim();

                if (!name) return;

                const player = players.find(
                  p => p.name === name
                );

                if (!player) return;

                const x = model(player);
                const matchupCell = tr.children[7];

                if (!matchupCell) return;

                let line = matchupCell.querySelector(
                  ".position-matchup-line"
                );

                if (!line) {
                  line = document.createElement("div");
                  line.className = "position-matchup-line";
                  line.style.fontSize = "11px";
                  line.style.marginTop = "4px";
                  line.style.fontWeight = "700";
                  matchupCell.appendChild(line);
                }

                const pct = Number(
                  x.positionMatchPct || 0
                );

                line.textContent =
                  "עמדה " + number1(pct);

                if (pct >= 3) {
                  line.style.color = "var(--accent)";
                } else if (pct <= -3) {
                  line.style.color = "var(--bad)";
                } else {
                  line.style.color = "var(--muted)";
                }

                line.title =
                  x.positionMatchup?.sampleGames
                    ? `מדגם: ${x.positionMatchup.sampleGames} משחקים`
                    : "אין מדגם נפרד לעמדה";
              });
            }

            function enhanceModal() {
              if (
                typeof players === "undefined" ||
                typeof model !== "function"
              ) {
                return;
              }

              const body = document.getElementById(
                "modalBody"
              );

              if (!body || !body.textContent) return;

              const player = players.find(
                p => body.textContent.includes(p.name)
              );

              if (!player) return;

              const x = model(player);

              if (
                body.querySelector(
                  ".position-matchup-modal"
                )
              ) {
                return;
              }

              const pct = Number(
                x.positionMatchPct || 0
              );

              const box =
                document.createElement("div");

              box.className =
                "notice position-matchup-modal";

              box.style.marginTop = "10px";

              const sample =
                x.positionMatchup?.sampleGames
                  ? ` • ${x.positionMatchup.sampleGames} משחקים במדגם`
                  : "";

              box.textContent =
                `מאצ׳אפ לפי עמדה (${player.pos}): ` +
                `${number1(pct)}${sample}`;

              body.appendChild(box);
            }

            function addRefreshButton() {
              if (
                document.getElementById(
                  "refreshAllBtn"
                )
              ) {
                return;
              }

              const head =
                document.querySelector(".head");

              if (!head) return;

              const btn =
                document.createElement("button");

              btn.id = "refreshAllBtn";
              btn.className = "secondary";
              btn.textContent = "↻ רענן הכול";

              btn.style.fontSize = "12px";
              btn.style.padding = "8px 10px";
              btn.style.whiteSpace = "nowrap";

              btn.onclick = async () => {
                btn.disabled = true;
                btn.textContent = "מרענן…";

                const badge =
                  document.getElementById(
                    "syncBadge"
                  );

                if (badge) {
                  badge.textContent =
                    "מרענן נתונים…";
                }

                try {
                  if (
                    typeof syncOfficial ===
                    "function"
                  ) {
                    await Promise.race([
                      syncOfficial(true),
                      new Promise(resolve =>
                        setTimeout(
                          resolve,
                          3000
                        )
                      )
                    ]);
                  }
                } catch (error) {
                  console.log(
                    "Official refresh:",
                    error
                  );
                }

                const url =
                  new URL(
                    window.location.href
                  );

                url.searchParams.set(
                  "refresh",
                  Date.now()
                );

                window.location.replace(
                  url.toString()
                );
              };

              const badge =
                document.getElementById(
                  "syncBadge"
                );

              if (
                badge &&
                badge.parentNode
              ) {
                badge.parentNode.insertBefore(
                  btn,
                  badge
                );
              } else {
                head.appendChild(btn);
              }
            }

            function runEnhancements() {
              addRefreshButton();
              enhanceRows();
              enhanceModal();
            }

            const observer =
              new MutationObserver(
                runEnhancements
              );

            const start = () => {
              runEnhancements();

              const rows =
                document.getElementById(
                  "rows"
                );

              if (rows) {
                observer.observe(
                  rows,
                  {
                    childList: true,
                    subtree: true
                  }
                );
              }

              const modal =
                document.getElementById(
                  "playerModal"
                );

              if (modal) {
                observer.observe(
                  modal,
                  {
                    childList: true,
                    subtree: true
                  }
                );
              }

              setInterval(
                enhanceRows,
                4000
              );
            };

            if (
              document.readyState ===
              "loading"
            ) {
              document.addEventListener(
                "DOMContentLoaded",
                start
              );
            } else {
              start();
            }
          })();
          EOF

      - name: Connect UI enhancements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(
              encoding="utf-8"
          )

          tag = (
              '<script '
              'src="./ui-live.js">'
              '</script>'
          )

          if tag not in html:
              html = html.replace(
                  "</body>",
                  tag + "</body>",
                  1
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

              print("UI enhancements connected")
          else:
              print("UI enhancements already connected")
          PY

      - name: Speed up automatic live sync
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path(".github/workflows/fantasy.sync.yml"),
              Path(".github/workflows/roster-sync.yml"),
              Path(".github/workflows/matchups-live.yml"),
          ]

          for path in files:
              if not path.exists():
                  print("Missing:", path)
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              new = text.replace(
                  'cron: "*/30 * * * *"',
                  'cron: "*/5 * * * *"'
              )

              if new != text:
                  path.write_text(
                      new,
                      encoding="utf-8"
                  )
                  print(
                      "Changed to 5-minute sync:",
                      path
                  )
              else:
                  print(
                      "Already 5-minute or different schedule:",
                      path
                  )
          PY

      - name: Save
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            ui-live.js \
            index.html \
            .github/workflows/fantasy.sync.yml \
            .github/workflows/roster-sync.yml \
            .github/workflows/matchups-live.yml

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m \
              "Add visible position matchups and refresh all"
            git push
          fi
