name: Install Recent Stats On Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add recent PIR stats to team cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path("ui-live.js")
          text = path.read_text(encoding="utf-8")

          helper = base64.b64decode("").decode("utf-8")
          observer = base64.b64decode("").decode("utf-8")

          if "function enhanceTeamRecentStats()" not in text:
              marker = "  function restoreTab() {"
              if marker not in text:
                  raise SystemExit("restoreTab marker not found")
              text = text.replace(marker, helper + marker, 1)

          if "    enhanceTeamRecentStats();" not in text:
              marker = "    enhanceModal();\n"
              if marker not in text:
                  raise SystemExit("enhanceModal marker not found")
              text = text.replace(
                  marker,
                  marker + "    enhanceTeamRecentStats();\n",
                  1
              )

          if 'document.getElementById("teamCards")' not in text:
              marker = (
                  '    const modalBody =\n'
                  '      document.getElementById("modalBody");\n'
              )
              if marker not in text:
                  raise SystemExit("modalBody marker not found")
              text = text.replace(
                  marker,
                  observer + marker,
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Save
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ui-live.js

          if git diff --cached --quiet; then
            echo "Already installed"
          else
            git commit -m "Show recent PIR on team cards"
            git push
          fi
