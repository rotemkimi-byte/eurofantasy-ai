name: EuroFantasy Position Matchups
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: position-matchups
  cancel-in-progress: false
jobs:
  position-matchups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build E2026 position defense from completed official games
        run: |
          node scripts/build-position-defense.cjs
          node tests/test_position_defense.cjs
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/build_player_identities.py
          node scripts/audit_player_identities.cjs
          git add player-identities.js data/player-identities.json data/integrity/player-identities.json
          git add data/position-matchups.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh E2026 position defense'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
