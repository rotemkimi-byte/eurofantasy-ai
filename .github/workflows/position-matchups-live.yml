name: EuroFantasy Position Matchups

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: position-matchups
  cancel-in-progress: true

jobs:
  position-matchups:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb

      - name: Download EuroLeague snapshot
        run: |
          curl -L --fail --retry 3 --retry-delay 3 \
            -o /tmp/euroleague.duckdb \
            https://raw.githubusercontent.com/McNews11/euroleague-open-data/main/data/euroleague.duckdb

      - name: Build position matchup model
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import duckdb

          DATA = Path("data")
          DATA.mkdir(exist_ok=True)
          DB = "/tmp/euroleague.duckdb"

          def norm(value):
              text = unicodedata.normalize("NFKD", str(value or ""))
              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )
              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text.lower()
              ).strip()

          def canon(name):
              n = norm(name)

              rules = [
                  ("efes", "Anadolu Efes"),
                  ("armani", "Milano"),
                  ("olimpia milan", "Milano"),
                  ("milano", "Milano"),
                  ("milan", "Milano"),
                  ("besiktas", "Besiktas"),
                  ("crvena", "Crvena Zvezda"),
                  ("red star", "Crvena Zvezda"),
                  ("dubai", "Dubai"),
                  ("barcelona", "Barcelona"),
                  ("bayern", "Bayern Munich"),
                  ("fenerbahce", "Fenerbahce"),
                  ("hapoel", "Hapoel Tel Aviv"),
                  ("baskonia", "Baskonia"),
                  ("asvel", "ASVEL"),
                  ("maccabi", "Maccabi Tel Aviv"),
                  ("olympiacos", "Olympiacos"),
                  ("panathinaikos", "Panathinaikos"),
                  ("paris", "Paris"),
                  ("partizan", "Partizan"),
                  ("real madrid", "Real Madrid"),
                  ("valencia", "Valencia"),
                  ("virtus", "Virtus Bologna"),
                  ("zalgiris", "Zalgiris"),
                  ("monaco", "Monaco"),
              ]

              for key, value in rules:
                  if key in n:
                      return value

              return str(name or "").strip()

          fantasy_positions = {}
          current_teams = set()

          try:
              players = json.loads(
                  (DATA / "players.json").read_text(
                      encoding="utf-8"
                  )
              )

              for p in players:
                  pos = str(
                      p.get("pos") or ""
                  ).upper().strip()

                  if pos in ("G", "F", "C"):
                      fantasy_positions[
                          norm(p.get("name"))
                      ] = pos

                  if p.get("team"):
                      current_teams.add(
                          canon(p.get("team"))
                      )

                  if p.get("opponent"):
                      current_teams.add(
                          canon(p.get("opponent"))
                      )

          except Exception as exc:
              print("Fantasy fallback warning:", exc)

          def position_code(position, position_name, player_name):
              raw = norm(
                  f"{position_name or ''} {position or ''}"
              )
              tokens = set(raw.split())

              # Center first so F/C hybrids count as bigs.
              if (
                  "center" in raw
                  or "centre" in raw
                  or "pivot" in raw
                  or "c" in tokens
                  or raw in ("5", "c")
              ):
                  return "C"

              if (
                  "guard" in raw
                  or "g" in tokens
                  or raw in ("1", "2", "pg", "sg", "g")
              ):
                  return "G"

              if (
                  "forward" in raw
                  or "f" in tokens
                  or raw in ("3", "4", "sf", "pf", "f")
              ):
                  return "F"

              return fantasy_positions.get(
                  norm(player_name)
              )

          con = duckdb.connect(DB, read_only=True)

          tables = {
              row[0]
              for row in con.execute("SHOW TABLES").fetchall()
          }

          required = {
              "boxscores_player",
              "games",
              "players",
              "teams",
          }

          missing = required - tables

          if missing:
              raise RuntimeError(
                  "Snapshot missing tables: "
                  + ", ".join(sorted(missing))
              )

          rows = con.execute(
              """
              SELECT
                  b.season_code,
                  b.game_code,
                  b.seconds_played,
                  b.valuation,
                  p.name AS player_name,
                  p.position,
                  p.position_name,
                  COALESCE(
                    ot.name,
                    ot.club_permanent_name,
                    ot.abbreviated_name,
                    CASE
                      WHEN b.team_code = g.home_team_code
                      THEN g.away_team_code
                      ELSE g.home_team_code
                    END
                  ) AS opponent_name
              FROM boxscores_player b
              JOIN games g
                ON g.season_code = b.season_code
               AND g.game_code = b.game_code
              LEFT JOIN players p
                ON p.person_code = b.person_code
              LEFT JOIN teams ot
                ON ot.season_code = b.season_code
               AND ot.team_code =
                   CASE
                     WHEN b.team_code = g.home_team_code
                     THEN g.away_team_code
                     ELSE g.home_team_code
                   END
              WHERE b.season_code IN ('E2025', 'E2026')
                AND g.played
                AND b.seconds_played >= 120
                AND b.valuation IS NOT NULL
              """
          ).fetchall()

          con.close()

          if not rows:
              raise RuntimeError(
                  "No EuroLeague boxscore rows found"
              )

          available_seasons = sorted(
              {str(row[0]) for row in rows}
          )
          latest_season = available_seasons[-1]

          print(
              "Snapshot seasons:",
              available_seasons,
              "latest:",
              latest_season
          )

          defense = defaultdict(
              lambda: {
                  "G": {
                      "pir": 0.0,
                      "seconds": 0.0,
                      "games": set(),
                  },
                  "F": {
                      "pir": 0.0,
                      "seconds": 0.0,
                      "games": set(),
                  },
                  "C": {
                      "pir": 0.0,
                      "seconds": 0.0,
                      "games": set(),
                  },
              }
          )

          league = {
              "G": {"pir": 0.0, "seconds": 0.0},
              "F": {"pir": 0.0, "seconds": 0.0},
              "C": {"pir": 0.0, "seconds": 0.0},
          }

          unknown = Counter()
          games_used = set()
          usable_rows = 0

          for row in rows:
              (
                  season,
                  game_code,
                  seconds,
                  valuation,
                  player_name,
                  position,
                  position_name,
                  opponent_name,
              ) = row

              pos = position_code(
                  position,
                  position_name,
                  player_name,
              )

              if pos not in ("G", "F", "C"):
                  unknown[
                      (str(position), str(position_name))
                  ] += 1
                  continue

              opponent = canon(opponent_name)

              if not opponent:
                  continue

              weight = (
                  2.5
                  if str(season) == latest_season
                  else 1.0
              )

              pir = float(valuation)
              sec = float(seconds)
              game_key = (str(season), int(game_code))

              item = defense[opponent][pos]
              item["pir"] += pir * weight
              item["seconds"] += sec * weight
              item["games"].add(game_key)

              league[pos]["pir"] += pir * weight
              league[pos]["seconds"] += sec * weight

              games_used.add(game_key)
              usable_rows += 1

          league_rates = {}

          for pos in ("G", "F", "C"):
              sec = league[pos]["seconds"]
              league_rates[pos] = (
                  league[pos]["pir"] / sec
                  if sec > 0
                  else 0.0
              )

          print(
              "Rows used:",
              usable_rows,
              "Games:",
              len(games_used),
              "League rates:",
              league_rates
          )

          if unknown:
              print(
                  "Unknown positions:",
                  unknown.most_common(10)
              )

          if (
              usable_rows < 1000
              or any(
                  league_rates[p] <= 0
                  for p in ("G", "F", "C")
              )
          ):
              raise RuntimeError(
                  "Position extraction incomplete: "
                  f"{usable_rows} rows; "
                  f"rates={league_rates}"
              )

          output = {}

          all_teams = (
              set(defense.keys())
              | {
                  team
                  for team in current_teams
                  if team
              }
          )

          for team in sorted(all_teams):
              output[team] = {}

              for pos in ("G", "F", "C"):
                  item = defense[team][pos]
                  seconds = item["seconds"]
                  games = len(item["games"])
                  league_rate = league_rates[pos]

                  if seconds <= 0:
                      factor = 1.0
                      raw = 1.0
                      allowed40 = None
                  else:
                      rate = item["pir"] / seconds
                      raw = rate / league_rate

                      reliability = min(
                          0.90,
                          games / 12.0
                      )

                      factor = (
                          1.0
                          + (raw - 1.0)
                          * reliability
                      )

                      factor = max(
                          0.88,
                          min(1.12, factor)
                      )

                      allowed40 = rate * 2400

                  output[team][pos] = {
                      "factor": round(factor, 5),
                      "pct": round(
                          (factor - 1) * 100,
                          2
                      ),
                      "rawFactor": round(raw, 5),
                      "allowedPirPer40": (
                          round(allowed40, 2)
                          if allowed40 is not None
                          else None
                      ),
                      "leaguePirPer40": round(
                          league_rate * 2400,
                          2
                      ),
                      "sampleGames": games,
                  }

          result = {
              "defense": output,
              "league": {
                  pos: {
                      "pirPer40": round(
                          league_rates[pos] * 2400,
                          2
                      )
                  }
                  for pos in ("G", "F", "C")
              },
              "gamesUsed": len(games_used),
              "playerRowsUsed": usable_rows,
              "seasonsUsed": available_seasons,
              "latestSeasonWeighted": latest_season,
              "source": (
                  "EuroLeague official data via "
                  "euroleague-open-data snapshot"
              ),
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
          }

          (DATA / "position-matchups.json").write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "SUCCESS:",
              len(output),
              "teams,",
              len(games_used),
              "games,",
              usable_rows,
              "player rows"
          )
          PY

      - name: Save
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/position-matchups.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update position matchups"
            git push
          fi
