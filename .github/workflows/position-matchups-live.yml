name: EuroFantasy Position Matchups

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  position-matchups:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build position matchup model
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path

          DATA = Path("data")
          DATA.mkdir(exist_ok=True)

          HEADERS = {
              "Accept": "application/json",
              "User-Agent": "EuroFantasy-AI/2.0"
          }

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers=HEADERS
              )
              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as r:
                  return json.loads(
                      r.read().decode("utf-8")
                  )

          def norm(value):
              text = unicodedata.normalize(
                  "NFKD",
                  str(value or "")
              )

              text = "".join(
                  c for c in text
                  if not unicodedata.combining(c)
              )

              return re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  text.lower()
              ).strip()

          def canon(name):
              n = norm(name)

              rules = [
                  ("efes", "Anadolu Efes"),
                  ("armani", "Milano"),
                  ("milano", "Milano"),
                  ("milan", "Milano"),
                  ("besiktas", "Besiktas"),
                  ("crvena", "Crvena Zvezda"),
                  ("red star", "Crvena Zvezda"),
                  ("dubai", "Dubai"),
                  ("barcelona", "Barcelona"),
                  ("bayern", "Bayern Munich"),
                  ("fenerbahce", "Fenerbahce"),
                  ("hapoel", "Hapoel Tel Aviv"),
                  ("baskonia", "Baskonia"),
                  ("asvel", "ASVEL"),
                  ("maccabi", "Maccabi Tel Aviv"),
                  ("olympiacos", "Olympiacos"),
                  ("panathinaikos", "Panathinaikos"),
                  ("paris", "Paris"),
                  ("partizan", "Partizan"),
                  ("real madrid", "Real Madrid"),
                  ("valencia", "Valencia"),
                  ("virtus", "Virtus Bologna"),
                  ("zalgiris", "Zalgiris"),
                  ("monaco", "Monaco"),
              ]

              for key, value in rules:
                  if key in n:
                      return value

              return str(name or "").strip()

          def club_name(side):
              if not isinstance(side, dict):
                  return ""

              club = side.get("club") or {}

              if isinstance(club, dict):
                  for key in (
                      "name",
                      "clubName",
                      "clubPermanentName",
                      "abbreviatedName",
                      "editorialName",
                      "code"
                  ):
                      if club.get(key):
                          return club[key]

              for key in (
                  "name",
                  "clubName",
                  "teamName"
              ):
                  if side.get(key):
                      return side[key]

              return ""

          def position_code(value):
              if value is None:
                  return None

              if isinstance(value, dict):
                  candidates = []

                  for key in (
                      "code",
                      "name",
                      "abbreviation",
                      "description",
                      "id"
                  ):
                      if value.get(key) is not None:
                          candidates.append(
                              value.get(key)
                          )

                  for candidate in candidates:
                      found = position_code(
                          candidate
                      )
                      if found:
                          return found

                  return None

              s = norm(value)

              mapping = {
                  "g": "G",
                  "pg": "G",
                  "sg": "G",
                  "guard": "G",
                  "point guard": "G",
                  "shooting guard": "G",

                  "f": "F",
                  "sf": "F",
                  "pf": "F",
                  "forward": "F",
                  "small forward": "F",
                  "power forward": "F",

                  "c": "C",
                  "center": "C",
                  "centre": "C",
              }

              if s in mapping:
                  return mapping[s]

              if "guard" in s:
                  return "G"

              if "forward" in s:
                  return "F"

              if (
                  "center" in s
                  or "centre" in s
              ):
                  return "C"

              # fallback for traditional 1-5
              if s in ("1", "2"):
                  return "G"

              if s in ("3", "4"):
                  return "F"

              if s == "5":
                  return "C"

              return None

          def person_name(person):
              if not isinstance(person, dict):
                  return ""

              for key in (
                  "name",
                  "fullName",
                  "alias"
              ):
                  if person.get(key):
                      return str(
                          person[key]
                      ).strip()

              first = (
                  person.get("firstName")
                  or ""
              )

              last = (
                  person.get("lastName")
                  or ""
              )

              return (
                  f"{first} {last}"
              ).strip()

          def person_code(person):
              if not isinstance(person, dict):
                  return ""

              for key in (
                  "code",
                  "personCode",
                  "id"
              ):
                  if person.get(key) is not None:
                      return str(
                          person[key]
                      ).strip()

              return ""

          # current Fantasy positions are an
          # additional fallback
          fantasy_positions = {}

          try:
              with open(
                  DATA / "players.json",
                  encoding="utf-8"
              ) as f:
                  fantasy_players = json.load(f)

              for p in fantasy_players:
                  pos = position_code(
                      p.get("pos")
                  )

                  if pos:
                      fantasy_positions[
                          norm(p.get("name"))
                      ] = pos

          except Exception as e:
              print(
                  "Fantasy position fallback:",
                  e
              )

          defense = {}

          league = {
              "G": {
                  "pir": 0.0,
                  "seconds": 0.0
              },
              "F": {
                  "pir": 0.0,
                  "seconds": 0.0
              },
              "C": {
                  "pir": 0.0,
                  "seconds": 0.0
              }
          }

          def bucket(team, pos):
              if team not in defense:
                  defense[team] = {
                      "G": {
                          "pir": 0.0,
                          "seconds": 0.0,
                          "games": set()
                      },
                      "F": {
                          "pir": 0.0,
                          "seconds": 0.0,
                          "games": set()
                      },
                      "C": {
                          "pir": 0.0,
                          "seconds": 0.0,
                          "games": set()
                      }
                  }

              return defense[team][pos]

          def load_people(season):
              by_code = {}
              by_name = {}

              url = (
                  "https://api-live.euroleague.net/"
                  "v2/competitions/E/seasons/"
                  f"{season}/people?limit=1000"
              )

              try:
                  payload = get_json(url)

                  rows = (
                      payload.get("data", [])
                      if isinstance(payload, dict)
                      else payload
                  )

                  if not isinstance(rows, list):
                      rows = []

                  for item in rows:
                      if not isinstance(item, dict):
                          continue

                      pos = position_code(
                          item.get("position")
                      )

                      if not pos:
                          continue

                      code = str(
                          item.get("code") or ""
                      ).strip()

                      name = norm(
                          item.get("name")
                          or item.get("alias")
                      )

                      if code:
                          by_code[code] = pos

                      if name:
                          by_name[name] = pos

              except Exception as e:
                  print(
                      "People warning:",
                      season,
                      e
                  )

              return by_code, by_name

          def get_player_pos(
              row,
              positions_by_code,
              positions_by_name
          ):
              player = (
                  row.get("player")
                  if isinstance(row, dict)
                  else {}
              ) or {}

              # 1. boxscore position
              pos = position_code(
                  player.get("position")
              )

              if pos:
                  return pos

              person = (
                  player.get("person")
                  or {}
              )

              code = person_code(person)

              # 2. season registration by code
              if (
                  code
                  and code in positions_by_code
              ):
                  return positions_by_code[
                      code
                  ]

              name = person_name(person)
              key = norm(name)

              # 3. season registration by name
              if (
                  key
                  and key in positions_by_name
              ):
                  return positions_by_name[
                      key
                  ]

              # 4. current Fantasy position
              if (
                  key
                  and key in fantasy_positions
              ):
                  return fantasy_positions[
                      key
                  ]

              return None

          def consume_side(
              side,
              defense_team,
              weight,
              game_key,
              positions_by_code,
              positions_by_name
          ):
              if not isinstance(side, dict):
                  return 0

              players = side.get(
                  "players",
                  []
              )

              if not isinstance(
                  players,
                  list
              ):
                  return 0

              accepted = 0

              for row in players:
                  if not isinstance(row, dict):
                      continue

                  stats = (
                      row.get("stats")
                      or {}
                  )

                  pos = get_player_pos(
                      row,
                      positions_by_code,
                      positions_by_name
                  )

                  if pos not in (
                      "G",
                      "F",
                      "C"
                  ):
                      continue

                  try:
                      pir = float(
                          stats.get(
                              "valuation"
                          )
                      )

                      seconds = float(
                          stats.get(
                              "timePlayed"
                          )
                      )

                  except (
                      TypeError,
                      ValueError
                  ):
                      continue

                  # DNP / garbage records
                  if seconds < 120:
                      continue

                  b = bucket(
                      defense_team,
                      pos
                  )

                  b["pir"] += (
                      pir * weight
                  )

                  b["seconds"] += (
                      seconds * weight
                  )

                  b["games"].add(
                      game_key
                  )

                  league[pos]["pir"] += (
                      pir * weight
                  )

                  league[pos]["seconds"] += (
                      seconds * weight
                  )

                  accepted += 1

              return accepted

          seasons = [
              ("E2025", 1.0),
              ("E2026", 2.5)
          ]

          total_games = 0
          usable_rows = 0

          for season, weight in seasons:

              positions_by_code, \
              positions_by_name = (
                  load_people(season)
              )

              games_url = (
                  "https://api-live.euroleague.net/"
                  "v2/competitions/E/seasons/"
                  f"{season}/games?limit=500"
              )

              try:
                  payload = get_json(
                      games_url
                  )

              except Exception as e:
                  print(
                      "Games warning:",
                      season,
                      e
                  )
                  continue

              rows = (
                  payload.get("data", [])
                  if isinstance(payload, dict)
                  else []
              )

              played = [
                  g for g in rows
                  if g.get("played")
                  and g.get("gameCode")
                  is not None
              ]

              # Last 140 games gives a good
              # recent sample and runs much faster
              played.sort(
                  key=lambda x: int(
                      x.get("gameCode")
                      or 0
                  )
              )

              played = played[-140:]

              def load_game(game):
                  code = game["gameCode"]

                  url = (
                      "https://api-live."
                      "euroleague.net/"
                      "v2/competitions/E/"
                      f"seasons/{season}/"
                      f"games/{code}/stats"
                  )

                  try:
                      return (
                          game,
                          get_json(url)
                      )
                  except Exception as e:
                      print(
                          "Boxscore warning:",
                          season,
                          code,
                          e
                      )
                      return (
                          game,
                          None
                      )

              # parallel fetch = much faster
              with ThreadPoolExecutor(
                  max_workers=6
              ) as executor:

                  futures = [
                      executor.submit(
                          load_game,
                          game
                      )
                      for game in played
                  ]

                  for future in as_completed(
                      futures
                  ):
                      game, box = (
                          future.result()
                      )

                      if not isinstance(
                          box,
                          dict
                      ):
                          continue

                      home = canon(
                          club_name(
                              game.get(
                                  "local"
                              ) or {}
                          )
                      )

                      away = canon(
                          club_name(
                              game.get(
                                  "road"
                              ) or {}
                          )
                      )

                      if not home or not away:
                          continue

                      code = game.get(
                          "gameCode"
                      )

                      game_key = (
                          f"{season}-{code}"
                      )

                      usable_rows += (
                          consume_side(
                              box.get(
                                  "local"
                              ),
                              away,
                              weight,
                              game_key,
                              positions_by_code,
                              positions_by_name
                          )
                      )

                      usable_rows += (
                          consume_side(
                              box.get(
                                  "road"
                              ),
                              home,
                              weight,
                              game_key,
                              positions_by_code,
                              positions_by_name
                          )
                      )

                      total_games += 1

          league_rates = {}

          for pos in (
              "G",
              "F",
              "C"
          ):
              sec = league[pos][
                  "seconds"
              ]

              league_rates[pos] = (
                  league[pos]["pir"] / sec
                  if sec > 0
                  else 0
              )

          # IMPORTANT:
          # fail rather than producing
          # a green workflow with empty data
          if (
              usable_rows < 500
              or any(
                  league_rates[p] <= 0
                  for p in (
                      "G",
                      "F",
                      "C"
                  )
              )
          ):
              raise RuntimeError(
                  "Position extraction failed: "
                  f"{usable_rows} usable "
                  "player rows"
              )

          output = {}

          for team, positions in (
              defense.items()
          ):
              output[team] = {}

              for pos in (
                  "G",
                  "F",
                  "C"
              ):
                  item = positions[pos]

                  seconds = item[
                      "seconds"
                  ]

                  pir = item[
                      "pir"
                  ]

                  games = len(
                      item["games"]
                  )

                  league_rate = (
                      league_rates[pos]
                  )

                  if (
                      seconds <= 0
                      or league_rate <= 0
                  ):
                      factor = 1.0
                      raw = 1.0
                      allowed40 = None

                  else:
                      rate = (
                          pir / seconds
                      )

                      raw = (
                          rate / league_rate
                      )

                      reliability = min(
                          0.90,
                          games / 12
                      )

                      factor = (
                          1
                          + (
                              raw - 1
                          )
                          * reliability
                      )

                      factor = max(
                          0.88,
                          min(
                              1.12,
                              factor
                          )
                      )

                      allowed40 = (
                          rate * 2400
                      )

                  output[team][pos] = {
                      "factor": round(
                          factor,
                          5
                      ),

                      "pct": round(
                          (
                              factor - 1
                          ) * 100,
                          2
                      ),

                      "rawFactor": round(
                          raw,
                          5
                      ),

                      "allowedPirPer40": (
                          round(
                              allowed40,
                              2
                          )
                          if allowed40
                          is not None
                          else None
                      ),

                      "leaguePirPer40":
                          round(
                              league_rate
                              * 2400,
                              2
                          ),

                      "sampleGames":
                          games
                  }

          result = {
              "defense": output,

              "league": {
                  pos: {
                      "pirPer40": round(
                          league_rates[pos]
                          * 2400,
                          2
                      )
                  }
                  for pos in (
                      "G",
                      "F",
                      "C"
                  )
              },

              "gamesUsed":
                  total_games,

              "playerRowsUsed":
                  usable_rows,

              "source":
                  "EuroLeague official API",

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }

          target = (
              DATA
              / "position-matchups.json"
          )

          target.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "SUCCESS:",
              len(output),
              "teams,",
              total_games,
              "games,",
              usable_rows,
              "player rows"
          )
          PY

      - name: Create position matchup loader
        run: |
          cat > position-matchups.js <<'EOF'
          (async () => {
            try {
              const response = await fetch(
                "./data/position-matchups.json?t="
                + Date.now(),
                { cache: "no-store" }
              );

              if (!response.ok) {
                throw new Error(
                  "Position data HTTP "
                  + response.status
                );
              }

              const data =
                await response.json();

              const defense =
                data.defense || {};

              if (
                !Object.keys(
                  defense
                ).length
              ) {
                throw new Error(
                  "Position matchup data empty"
                );
              }

              if (
                window
                  .__positionMatchupsPatched
              ) {
                return;
              }

              window
                .__positionMatchupsPatched =
                true;

              const originalModel =
                model;

              const teamKey = value => {
                const s = String(
                  value || ""
                ).toLowerCase();

                const aliases = [
                  ["efes", "Anadolu Efes"],
                  ["milano", "Milano"],
                  ["armani", "Milano"],
                  ["besiktas", "Besiktas"],
                  ["crvena", "Crvena Zvezda"],
                  ["red star", "Crvena Zvezda"],
                  ["dubai", "Dubai"],
                  ["barcelona", "Barcelona"],
                  ["bayern", "Bayern Munich"],
                  ["fenerbahce", "Fenerbahce"],
                  ["hapoel", "Hapoel Tel Aviv"],
                  ["baskonia", "Baskonia"],
                  ["asvel", "ASVEL"],
                  ["maccabi", "Maccabi Tel Aviv"],
                  ["olympiacos", "Olympiacos"],
                  ["panathinaikos", "Panathinaikos"],
                  ["paris", "Paris"],
                  ["partizan", "Partizan"],
                  ["real madrid", "Real Madrid"],
                  ["valencia", "Valencia"],
                  ["virtus", "Virtus Bologna"],
                  ["zalgiris", "Zalgiris"],
                  ["monaco", "Monaco"]
                ];

                for (
                  const [
                    needle,
                    result
                  ]
                  of aliases
                ) {
                  if (
                    s.includes(needle)
                  ) {
                    return result;
                  }
                }

                return value;
              };

              model = function(p) {
                const x =
                  originalModel(p);

                const opponent =
                  teamKey(
                    x.match?.opponent
                    || p.opponent
                  );

                const row =
                  defense?.[opponent]?.[
                    p.pos
                  ];

                if (!row) {
                  x.positionMatchPct = 0;
                  return x;
                }

                const factor =
                  Number(
                    row.factor || 1
                  );

                x.positionMatchPct =
                  Number(
                    row.pct || 0
                  );

                x.positionMatchup =
                  row;

                if (
                  p.status !== "out"
                  && factor > 0
                ) {
                  x.expected *= factor;
                  x.floor *= factor;
                  x.ceiling *= factor;

                  x.value =
                    x.expected
                    /
                    Math.max(
                      .1,
                      Number(p.price)
                    );

                  const teamFactor =
                    1
                    + Number(
                      x.matchPct || 0
                    ) / 100;

                  x.matchPct =
                    (
                      teamFactor
                      * factor
                      - 1
                    ) * 100;
                }

                return x;
              };

              renderAll();

              console.log(
                "Position matchups active:",
                Object.keys(
                  defense
                ).length,
                "teams"
              );

            } catch (e) {
              console.error(
                "Position matchup:",
                e
              );
            }
          })();
          EOF

      - name: Connect loader
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(
              encoding="utf-8"
          )

          tag = (
              '<script '
              'src="./position-matchups.js">'
              '</script>'
          )

          if tag not in html:
              html = html.replace(
                  "</body>",
                  tag + "</body>"
              )

              p.write_text(
                  html,
                  encoding="utf-8"
              )
          PY

      - name: Save
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/position-matchups.json \
            position-matchups.js \
            index.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m \
              "Fix position matchup model"

            git push
          fi
