name: EuroFantasy scheduled install-rolling-learning

on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'

permissions: {}

concurrency:
  group: eurofantasy-matchup-context
  cancel-in-progress: false

jobs:
  refresh:
    # Do not activate schedules on the staging repository or the old repository.
    if: github.repository_id == '1466932960' && github.repository == 'rotemkimi-byte/eurofantasy-ai' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/private-scheduled-task.yml
    with:
      task: 'install-rolling-learning'
      timeout: 25
    secrets:
      DEV_REPOSITORY_TOKEN: ${{ secrets.DEV_REPOSITORY_TOKEN }}
