name: EuroFantasy Roster Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"
  push:
    paths:
      - roster_sync.py
      - .github/workflows/roster-sync.yml

permissions:
  contents: write

concurrency:
  group: eurofantasy-roster-sync
  cancel-in-progress: false

jobs:
  sync-roster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync my Fantasy roster
        env:
          FANTASY_TOKEN: ${{ secrets.FANTASY_TOKEN }}
        run: python roster_sync.py

      - name: Save roster data
        run: |
          git config user.name "eurofantasy-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/build_player_identities.py
          node scripts/audit_player_identities.cjs
          git add player-identities.js data/player-identities.json data/integrity/player-identities.json
          git add data/roster.json data/rosters.json
          if git diff --cached --quiet; then
            echo "No roster changes"
          else
            git commit -m "Auto update Fantasy roster"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch --no-tags origin main
              git rebase FETCH_HEAD
            done
            exit 1
          fi
